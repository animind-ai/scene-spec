# 洞察系列 #2 3×4 和 4×3 一样大？（数的世界入门系列第二集，二年级）。
# 开场就是 #1 的片尾画面（装满的十格框）；钩子问两排五个和五排两个一样多吗、停三秒、说出迷思；
# 满框换成同样大小的两排五点阵转 90° 当场回答；再换成三排四个的点阵，预测暂停后整体转 90° 成四排三个，点一个不多一个不少；
# 非例：减法换顺序，两个拿不走五个；落到 3 × 4 = 4 × 3 = 12。结尾：四排三个的点阵、两个标签、3 × 4 = 4 × 3（#3 的开头画面）。
# 十格框组件没有 rotate，所以转之前先把框里的点换成同色，再换成外观相同的 dot_array（cells: true）。
# 脚本：insight/ep02-commutative-array/script.yaml（第 1 轮）。
spec: "0.1"

meta:
  id: ep02
  title: 3×4 和 4×3 一样大？
  line: insight
  units: [P3]
  episode: 2
  grade: 二年级
  author: Boxi Yu
  license: CC-BY-4.0

pedagogy:
  insight: 把点阵整个转一下，三排四个就成了四排三个，点一个没多、一个没少，所以三乘四等于四乘三
  misconception: 三个四和四个三是两回事，所以不一定一样多
  non_example: 减法不能换顺序：五个拿走两个剩三个，两个要拿走五个根本不够拿
  status: proof
  landing: Equation

style:
  theme: paper
  canvas: "16:9"
  voice:
    persona: friend-ps
    speed: 1.0
  segmented: true
  step_hold: 1.0

objects:
  # 开场：#1 的片尾（同样的定义，排版才一样）
  frame:
    widget: ten_frame
    side: 5
    in: stage
  q:
    type: text
    text: '$2$ 排 $5$ 个 $=$ $5$ 排 $2$ 个？'
    level: title
    in: top
  myth:
    type: text
    text: 两个五和五个二，是两回事？
    role: "NO"
    in: footer
  tfa:
    widget: dot_array
    rows: 2
    cols: 5
    cells: true
    in: stage
  array:
    widget: dot_array
    rows: 3
    cols: 4
    room: [4, 10]
    in: stage
  lab34:
    type: text
    text: '[$3$ 排]{#r .A}，[每排 $4$ 个]{#c .B}'
    level: title
    in: top
  lab43:
    type: text
    text: '[$4$ 排]{#r .B}，[每排 $3$ 个]{#c .A}'
    level: title
    in: top
  sum3:
    type: text
    text: '$4+4+4=12$'
    level: title
    in: footer
  sum4:
    type: text
    text: '$3+3+3+3=12$'
    level: title
    right_of: sum3
    gap: xl
  sub5:
    widget: dot_array
    rows: 1
    cols: 5
    in: stage
  sub2:
    widget: dot_array
    rows: 1
    cols: 2
    in: stage
  subt1:
    type: text
    text: '$5-2=3$'
    level: title
    in: footer
  subt2:
    type: text
    text: '[$2-5$]{#x}：不够拿'
    level: title
    in: footer
  eq:
    type: text
    text: '[$3\times4$]{#a .A} [$=$]{#e} [$4\times3$]{#b .B} [$=12$]{#c .HL}'
    level: title
    in: top
  end_eq:
    type: text
    text: '$3\times4=4\times3$'
    level: title
    in: top

beats:
  - id: Hook
    pause: {type: predict, prompt: 两排五个人换成五排两个，人数变吗？, hold: 3, app_item: ep02-before-1}
    say:
      - {id: s1, pace: ask, text: "{@q}排队时两排五个人，换成五排两个，人数变吗？", en: "We line up in two rows of five, then switch to five rows of two. Does the number of kids change?"}
      - {id: s2, pace: normal, text: "你先想一想，变还是不变？", en: "Think about it first: does it change or not?"}
    do:
      # 开场：一下子摆出 #1 的片尾画面
      - {at: s1, act: show, target: frame, dur: 0.01}
      - {with: prev, act: fill, target: frame, args: {count: 8}, dur: 0.01}
      - {after: prev, act: fill, target: frame, args: {count: 2, role: B}, dur: 0.01}
      - {at: s1@q, act: show, target: q}

  - id: Myth
    shows: misconception
    say:
      - {id: s1, pace: normal, text: "{@m}有同学嘀咕：两个五和五个二，是两回事。", en: "One kid mutters: two fives and five twos are different things."}
    do:
      - {at: s1@m, act: show, target: myth}

  - id: TurnFrame
    say:
      - {id: s1, pace: normal, text: "我们一起看。{@r}把十格框整个转过来。", en: "Let's look together. We turn the whole ten frame around."}
      - {id: s2, pace: normal, text: "{@d}变成五排两个，一个点也没多，一个也没少。", en: "Now it's five rows of two: not one dot more, not one less."}
      - {id: s3, pace: normal, text: "{@n}再换一个点阵：三排，每排四个点。", en: "Here's another dot array: three rows, four dots in each."}
      - {id: s4, pace: normal, text: "{@s}这是三个四：四加四加四，一共十二个。", en: "That's three fours: four plus four plus four, twelve in all."}
    do:
      - {at: s1, act: hide, target: myth}
      - {with: prev, act: recolor, target: frame, args: {which: frame, role: A}}
      - {after: prev, act: hide, target: frame, dur: 0.5}
      - {with: prev, act: show, target: tfa, dur: 0.5}
      - {at: s1@r, act: rotate, target: tfa, dur: 1.4}
      - {at: s2@d, act: hold, dur: 0.6}
      - {at: s3, act: step}
      - {at: s3@n, act: hide, target: tfa}
      - {with: prev, act: hide, target: q}
      - {after: prev, act: show, target: array}
      - {with: prev, act: show, target: lab34}
      - {at: s4@s, act: show, target: sum3}

  - id: Wrong
    shows: misconception
    say:
      - {id: s1, pace: normal, text: "那四排三个呢？{@a}要重新摆一次，再数一遍吗？", en: "What about four rows of three? Do we set it up and count all over again?"}
    do:
      - {at: s1@a, act: mark, target: "lab34#c"}
      - {after: prev, act: unmark, target: "lab34#c"}

  - id: Predict
    pause: {type: predict, prompt: 把点阵转过来，点会变多、变少，还是一样？, hold: 2.5, app_item: ep02-predict-1}
    say:
      - {id: s1, pace: ask, text: "把这块点阵转过来，{@q}点会变多、变少，还是一样？", en: "If we turn this array around, will there be more dots, fewer, or the same?"}
    do:
      - {at: s1@q, act: recolor, target: array, args: {role: HL}}

  - id: Rotate
    say:
      - {id: s1, pace: slow, text: "{@r}转一下，就成了四排，每排三个点。", en: "Turn it, and it becomes four rows, three dots in each."}
      - {id: s2, pace: normal, text: "{@s}三加三加三加三，还是十二个，一个也不少。", en: "Three plus three plus three plus three: still twelve, not one missing."}
      - {id: s3, pace: normal, text: "{@b}一个点没加，一个点没拿，只是换了一个方向。", en: "Nothing added, nothing taken away. It just faces a new way."}
    do:
      - {at: s1, act: recolor, target: array, args: {role: A}}
      - {with: prev, act: hide, target: lab34}
      - {at: s1@r, act: rotate, target: array, dur: 1.4}
      - {after: prev, act: show, target: lab43}
      - {at: s2, act: step}
      - {at: s2@s, act: show, target: sum4}
      - {at: s3@b, act: hide, target: lab43}
      - {after: prev, act: rotate, target: array, args: {dir: cw}, dur: 1.0}
      - {after: prev, act: rotate, target: array, dur: 1.0}
      - {after: prev, act: show, target: lab43}

  - id: Reveal
    shows: non_example
    say:
      - {id: s1, pace: slow, text: "{@a}三个四和四个三，原来是同一堆点。", en: "Three fours and four threes are the very same dots."}
      - {id: s2, pace: normal, text: "可是减法就不行。{@t}五个拿走两个，剩三个。", en: "But subtraction doesn't work like this. Five take away two leaves three."}
      - {id: s3, pace: normal, text: "{@n}两个要拿走五个，根本不够拿，顺序换不了。", en: "Two take away five? There aren't enough. You can't swap the order."}
    do:
      - {at: s1@a, act: recolor, target: array, args: {role: HL}}
      - {at: s2, act: step}
      - {at: s2, act: recolor, target: array, args: {role: A}}
      - {after: prev, act: hide, target: array}
      - {with: prev, act: hide, target: lab43}
      - {with: prev, act: hide, target: sum3}
      - {with: prev, act: hide, target: sum4}
      - {after: prev, act: show, target: sub5}
      - {at: s2@t, act: fade_col, target: sub5, args: {col: 4}}
      - {after: prev, act: fade_col, target: sub5, args: {col: 3}}
      - {with: prev, act: show, target: subt1}
      - {at: s3@n, act: hide, target: sub5}
      - {with: prev, act: hide, target: subt1}
      - {after: prev, act: show, target: sub2}
      - {with: prev, act: show, target: subt2}
      - {after: prev, act: cross, target: "subt2#x"}

  - id: Equation
    shows: landing
    say:
      - {id: s1, pace: normal, text: "{@e}写成算式，三乘四，就等于四乘三，都是十二。", en: "As a number sentence, three times four equals four times three. Both are twelve."}
      - {id: s2, pace: normal, text: "{@r}排数是一个数，{@c}每排几个，是另一个数。", en: "The number of rows is one number; how many in each row is the other."}
    do:
      - {at: s1, act: hide, target: sub2}
      - {with: prev, act: hide, target: subt2}
      - {after: prev, act: show, target: array}
      - {with: prev, act: show, target: lab43}
      - {at: s1@e, act: hide, target: lab43}
      - {after: prev, act: show, target: eq}
      - {at: s2@r, act: mark, target: "eq#b"}
      - {at: s2@c, act: mark, target: "eq#a"}

  - id: LookBack
    say:
      - {id: s1, pace: normal, text: "换成六排七个也一样，转一转，个数不变。", en: "Six rows of seven works too. Turn it, and the count stays the same."}
      - {id: s2, pace: normal, text: "看完和大人一起，用纽扣摆一摆，再转一转。", en: "After watching, line up some buttons with a grown-up and turn them around."}
      - {id: s3, pace: ask, text: "{@n}下一集：九的口诀，为什么十位加一、个位减一？", en: "Next time: in the nines table, why do the tens go up by one and the ones go down by one?"}
    do:
      - {at: s1, act: unmark, target: "eq#a"}
      - {with: prev, act: unmark, target: "eq#b"}
      # 收成 #3 的开头画面：四排三个的点阵、两个标签、3 × 4 = 4 × 3
      - {at: s3@n, act: hide, target: eq}
      - {after: prev, act: show, target: end_eq}
