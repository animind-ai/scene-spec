# v2 版式副本：与 ep11-parallelogram.scene.yaml 相同，只加 style.layout: v2（无右侧栏、顶栏 1.0、满宽 stage；字幕仍是双语两行烧录带）。
# 洞察系列 #11 平行四边形面积：剪一刀，挪过去（五年级）。面积系列（area）第一集，接 #12。
# 按脚本 insight/ep11-parallelogram-area/script.yaml（第 1 轮）写；早先样片 ep11.scene.yaml 留给截图回归。
# 钩子问底乘高还是底乘斜边、停三秒、说出"底乘斜边"；底 × 斜边的长方形叠上去明显更高，装不满；
# 预测暂停后沿高剪开、平移、拼成长方形：长是底、宽是高，斜边拼进里面；非例：往下压扁，底和斜边不变、面积趋于零；
# 落到 S = a × h。结尾：拼好的长方形（带底 a、高 h 两条参考线）和右侧 S = a × h（#12 的开头画面）。
spec: "0.1"

meta:
  id: ep11
  title: 平行四边形面积：剪一刀，挪过去
  line: insight
  units: [M5]
  episode: 11
  grade: 五年级
  author: Boxi Yu
  license: CC-BY-4.0

pedagogy:
  insight: 沿高剪下一个三角形平移到另一边，平行四边形就拼成了长方形；长是底、宽是高，斜边被拼进了里面，所以面积是底乘高
  misconception: 平行四边形的面积是底乘斜边，就像长方形长乘宽一样
  non_example: 把平行四边形往下压，底和斜边都不变，面积却越来越小，压平了是零，底乘斜边却一点没变
  status: proof
  landing: Landing

style:
  layout: v2  # 培玉视觉规范 v2（style-v2 批量重渲，2026-10-20）
  theme: paper
  canvas: "16:9"
  voice:
    persona: friend-ps
    speed: 1.0
  segmented: true
  step_hold: 1.0

objects:
  para:
    widget: dissect
    role: A
    in: stage
    shapes:
      P:
        polygon: [[0, 0], [6, 0], [9, 3], [3, 3]]
        edges:
          - {at: [[0, 0], [6, 0]], text: '底 $a$'}
          - {at: [[0, 0], [3, 3]], text: '斜边 $b$'}
    cuts:
      c1: {piece: P, line: [[3, 3], [3, 0]], into: [T, Q]}
    pieces:
      T: {role: B}
    guides:
      h: {from: [3, 3], to: [3, 0], label: '高 $h$', role: HL}
      tall: {from: [0, 4.243], to: [6, 4.243], label: '$a\times b$ 的高', role: NO}
      base: {from: [3, 0], to: [9, 0], label: '$a$', role: HL, side: below, solid: true}
      seam: {from: [6, 0], to: [9, 3], label: '$b$', role: NO}
    merges:
      R: {pieces: [T, Q], role: HL}
  flat:
    widget: dissect
    role: A
    in: stage
    shapes:
      F1:
        polygon: [[0, 0], [6, 0], [9, 3], [3, 3]]
        hidden: true
        edges: [{at: [[0, 0], [3, 3]], text: '$b$'}]
      F2:
        polygon: [[0, 0], [6, 0], [9.969, 1.5], [3.969, 1.5]]
        hidden: true
        edges: [{at: [[0, 0], [3.969, 1.5]], text: '$b$'}]
      F3:
        polygon: [[0, 0], [6, 0], [10.213, 0.5], [4.213, 0.5]]
        hidden: true
        role: NO
        edges:
          - {at: [[0, 0], [4.213, 0.5]], text: '$b$'}
          - {at: [[0, 0], [6, 0]], text: '$a$'}
  wrong:
    type: text
    text: '[$S=a\times b$]{#w}？'
    role: "NO"
    level: display
    in: side
  paint:
    # 开场情境：和 wrong 同一个位置，Myth 里换成 wrong
    type: text
    text: '[桌板要刷多少漆？]{#g}'
    level: title
    in: side
  law:
    type: text
    text: '[$S$]{#s} [$=$]{#e} [$a$]{#a .HL} [$\times$]{#x} [$h$]{#h .HL}'
    level: display
    in: side

i18n:
  en:
    meta: {title: "Parallelogram Area: One Cut, One Slide"}
    objects:
      para:
        shapes:
          P:
            edges:
              - {at: [[0, 0], [6, 0]], text: 'Base $a$'}
              - {at: [[0, 0], [3, 3]], text: 'Slant $b$'}
        guides:
          h: {label: 'Height $h$'}
          tall: {label: 'Height for $a\times b$'}
      paint: {text: '[Paint needed?]{#g}'}
      wrong: {text: '[$S=a\times b$]{#w}?'}
    beats:
      Hook: {pause: {prompt: "For a parallelogram tabletop, is the area base times height, or base times slanted side?"}}
      Predict: {pause: {prompt: "Cut along the height and slide the triangle to the other side. What shape do you get?"}}

beats:
  - id: Hook
    pause: {type: predict, prompt: 平行四边形桌板的面积，底乘高还是底乘斜边？, hold: 3, app_item: ep11-before-1}
    say:
      - {id: s1, pace: ask, text: "{@p}木工师傅给一块平行四边形的桌板刷漆，底和斜边都量好了，面积怎么算？", en: "{@p}A carpenter is painting a parallelogram tabletop. The base and the slanted side are measured. How do we get its area?"}
      - {id: s2, pace: normal, text: "换作是你，先拿个主意。", en: "If it were you, make up your mind first."}
    do:
      - {at: s1@p, act: show, target: para}
      - {with: prev, act: show, target: paint}

  - id: Myth
    shows: misconception
    say:
      - {id: s1, pace: normal, text: "徒弟抢着说：{@w}底乘斜边嘛，就像长方形长乘宽一样。", en: "The apprentice jumps in: {@w}base times slanted side, just like length times width for a rectangle."}
    do:
      - {at: s1@w, act: hide, target: paint}
      - {with: prev, act: show, target: wrong}

  - id: Setup
    say:
      - {id: s1, pace: normal, text: "我们一起看。这个平行四边形，底是 a，斜着的这条边是 b。", en: "Let's look together. This parallelogram has base a, and this slanted side is b."}
      - {id: s2, pace: normal, text: "长方形的宽是竖着量的，平行四边形竖着量，{@h}是这条高 h。", en: "A rectangle's width is measured straight up. Measured straight up, the parallelogram has {@h}this height h."}
    do:
      - {at: s2@h, act: show, target: "para#h"}

  - id: Wrong
    shows: misconception
    say:
      - {id: s1, pace: normal, text: "如果是底乘斜边，{@t}它就该和这个长方形一样大才对。", en: "If it were base times slanted side, it would have to be as big as {@t}this rectangle."}
      - {id: s2, pace: normal, text: "可这个长方形明显更高，{@x}平行四边形根本装不满它。", en: "But this rectangle is clearly taller. {@x}The parallelogram can't fill it."}
    do:
      - {at: s1@t, act: show, target: "para#tall"}
      - {at: s2@x, act: focus, target: "para#tall"}
      - {after: prev, act: unfocus, target: para}
      - {with: prev, act: hide, target: "para#tall"}

  - id: Predict
    pause: {type: predict, prompt: 沿着高剪一刀，把剪下来的三角形挪到另一边，能拼成什么？, hold: 3, app_item: ep11-predict-1}
    say:
      - {id: s1, pace: ask, text: "如果{@cut}沿着高剪一刀，剪下的三角形挪到另一边，能拼成什么？", en: "{@cut}Cut along the height and move the cut-off triangle to the other side. What shape do you get?"}
    do:
      - {at: s1@cut, act: focus, target: "para#h"}

  - id: Cut
    say:
      - {id: s1, pace: normal, text: "{@cut}沿着这条高剪开，{@go}把左边剪下的三角形平移到右边。", en: "{@cut}Cut along the height and {@go}slide the triangle on the left over to the right."}
      - {id: s2, pace: normal, text: "{@fit}斜边正好对着另一条斜边，严丝合缝，不留缝隙。", en: "{@fit}The slanted edge meets the other slanted edge exactly. No gaps."}
      - {id: s3, pace: slow, text: "{@rect}拼成了一个长方形，一块没多，一块没少。", en: "{@rect}It's a rectangle now, with nothing added and nothing lost."}
    do:
      - {at: s1, act: unfocus, target: para}
      - {at: s1@cut, act: cut, target: para, args: {cut: c1}, dur: 1.0}
      - {after: prev, act: shift, target: para, args: {piece: T, by: [-0.4, 0]}, dur: 0.4}
      - {at: s1@go, act: snap, target: para, args: {piece: T, edge: [[0, 0], [3, 3]], to: Q, to_edge: [[6, 0], [9, 3]]}, dur: fit}
      - {at: s2@fit, act: show, target: "para#seam"}
      - {at: s3@rect, act: merge, target: para, args: {name: R}, dur: 0.8}

  - id: Reveal
    shows: non_example
    say:
      - {id: s1, pace: normal, text: "拼出来的长方形，{@a}长就是原来的底，{@h}宽就是原来的高。", en: "In this rectangle, {@a}the length is the old base and {@h}the width is the old height."}
      - {id: s2, pace: slow, text: "那斜边呢？{@seam}它被拼进了长方形里面，根本没用上。", en: "And the slanted side? {@seam}It's tucked inside the rectangle and isn't used at all."}
      - {id: s3, pace: normal, text: "再试一下：{@f1}把平行四边形往下压，{@f2}底不变，斜边也不变。", en: "One more test: {@f1}squash the parallelogram down. {@f2}The base stays the same, and so does the slanted side."}
      - {id: s4, pace: normal, text: "{@f3}它却越来越扁，面积越来越小，{@zero}压平了，面积就是零。", en: "{@f3}But it gets flatter and its area gets smaller. {@zero}Flat out, the area is zero."}
      - {id: s5, pace: normal, text: "{@x}可底乘斜边一点都没变，所以它算的不是面积。", en: "{@x}Yet base times slanted side hasn't changed at all, so it can't be the area."}
    do:
      - {at: s1, act: step}
      - {at: s1@a, act: show, target: "para#base"}
      - {at: s1@h, act: mark, target: "para#h"}
      - {at: s2@seam, act: focus, target: "para#seam"}
      - {at: s3, act: step}
      - {at: s3, act: unfocus, target: para}
      - {with: prev, act: hide, target: para}
      - {at: s3@f1, act: show, target: "flat#F1"}
      - {at: s3@f2, act: labels, target: flat, args: {piece: F1, show: false}}
      - {with: prev, act: set, target: "flat#F1", args: {opacity: 0.3}}
      - {with: prev, act: show, target: "flat#F2"}
      - {at: s4@f3, act: labels, target: flat, args: {piece: F2, show: false}}
      - {with: prev, act: set, target: "flat#F2", args: {opacity: 0.3}}
      - {with: prev, act: show, target: "flat#F3"}
      - {at: s4@zero, act: focus, target: "flat#F3"}
      - {at: s5@x, act: cross, target: "wrong#w"}

  - id: Landing
    shows: landing
    say:
      - {id: s1, pace: slow, text: "{@law}所以平行四边形的面积，就等于底乘高。", en: "{@law}So a parallelogram's area is simply base times height."}
      - {id: s2, pace: normal, text: "{@a}长方形的长对着底，{@h}宽对着高，斜边根本不参与。", en: "{@a}The rectangle's length is the base, {@h}its width is the height, and the slanted side doesn't come into it."}
    do:
      - {at: s1, act: unfocus, target: flat}
      - {with: prev, act: hide, target: flat}
      - {with: prev, act: hide, target: wrong}
      - {after: prev, act: show, target: para}
      - {at: s1@law, act: show, target: law}
      - {at: s2@a, act: mark, target: "law#a"}
      - {at: s2@h, act: mark, target: "law#h"}

  - id: Close
    say:
      - {id: s1, pace: normal, text: "记住这一刀：剪下三角形，挪过去，平行四边形就成了长方形。", en: "Remember this cut: snip off the triangle, slide it over, and the parallelogram becomes a rectangle."}
      - {id: s2, pace: ask, text: "{@q}三角形的面积为什么要除以二？", en: "{@q}So why does a triangle's area have a divide-by-two in it?"}
    do:
      - {at: s1, act: unmark, target: "law#a"}
      - {with: prev, act: unmark, target: "law#h"}
      - {with: prev, act: unmark, target: "para#h"}
      - {with: prev, act: hide, target: "para#seam"}
