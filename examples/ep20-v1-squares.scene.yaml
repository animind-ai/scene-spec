# 第 1 版（正方形，Tennenbaum），2026-10-18 用户反馈「我没能理解」，换成 ep20.scene.yaml 的"找尺子"版；留档，截图回归在用。
# 洞察系列 #20 √2 为什么不是分数（八年级）。单集，试做。按脚本 insight/ep20-sqrt2-irrational/script.yaml（第 1 轮）写。
# 一个洞察（Tennenbaum 的正方形证明）：假设 √2 = a/b 取最小的一对，a² = 2b²：边长 a 的正方形 = 两个边长 b 的正方形；
# 两个 b 方放进 a 方的对角，盖两次的中间那块 (2b−a)² = 两个空角 2(a−b)²，又是"一个正方形等于两个"，边长更小的正整数，矛盾。
# 画法：plane 不要网格和坐标轴，只用 shape（填色多边形，带名字）。a = 7 个画面单位，b = 7/√2 ≈ 4.9497，a − b ≈ 2.0503。
# 钩子问有没有分数平方正好是 2、停三秒、说出"差不多就是分数"；预测暂停"这个等式眼熟吗"；中间那块里再嵌两层；
# 非例 7/5：49 和 50 差 1；落到 √2 是无理数，说明这是证明；埋 √3。
spec: "0.1"

meta:
  id: ep20-v1-squares
  title: √2 为什么不是分数
  line: insight
  units: [J5]
  episode: 20
  grade: 八年级
  author: Boxi Yu
  license: CC-BY-4.0

pedagogy:
  insight: 假设根号二等于 a 比 b 且是最小的一对，边长 a 的正方形等于两个边长 b 的正方形；放进对角后盖两次的中间那块等于两个空角，又是一对更小的正整数，矛盾
  misconception: 分数可以无限接近根号二，差不多就是分数了
  non_example: 七比五很接近，但七的平方四十九，五的平方的两倍是五十，差一就不是相等
  status: proof
  landing: Landing

style:
  theme: paper
  canvas: "16:9"
  voice:
    persona: peer-ms
    speed: 1.0
  segmented: true
  step_hold: 1.0

objects:
  q:
    type: text
    text: '$\left(\dfrac{a}{b}\right)^2=2\ ?$'
    level: title
    in: top
  myth:
    type: text
    text: '[差不多就是？]{#m}'
    role: "NO"
    level: title
    right_of: q
    gap: lg
  plane:
    widget: plane
    x: [0, 7]
    y: [0, 7]
    grid: false
    numbers: false
    in: stage
  f1:
    type: text
    text: '[$\sqrt{2}=\dfrac{a}{b}$]{#e}，[$a$、$b$ 是最小的一对正整数]{#min}'
    level: title
    in: footer
  f2:
    type: text
    text: '$a^2=2b^2$'
    level: title
    in: footer
  f3:
    type: text
    text: '[$(2b-a)^2$]{#l .HL} [$=2(a-b)^2$]{#r .NO}'
    level: title
    in: footer
  f4:
    type: text
    text: '[$7^2=49$]{#a}，[$2\times 5^2=50$]{#b}'
    role: "NO"
    level: title
    in: footer

beats:
  - id: Hook
    pause: {type: predict, prompt: 有没有一个分数，平方以后正好等于二？先猜一猜。, hold: 3, app_item: ep20-before-1}
    say:
      - {id: s1, pace: ask, text: "{@q}有没有一个分数，平方以后正好等于二？", en: "Is there a fraction whose square is exactly two?"}
      - {id: s2, pace: normal, text: "先猜一猜，想三秒钟。", en: "Take a guess. Think for three seconds."}
    do:
      - {at: s1@q, act: show, target: q}
      - {with: prev, act: show, target: plane}
      - {with: prev, act: hide, target: plane.axes, dur: 0.1}

  - id: Myth
    shows: misconception
    say:
      - {id: s1, pace: normal, text: "很多人觉得，{@m}分数能无限接近根号二，差不多就是分数了。", en: "Lots of people think fractions get so close to root two that it's basically a fraction."}
    do:
      - {at: s1@m, act: show, target: myth}

  - id: Setup
    say:
      - {id: s1, pace: normal, text: "我们一起看。{@f}假设根号二等于 a 比 b，a 和 b 都是正整数。", en: "Let's look together. Suppose root two equals a over b, with a and b whole numbers."}
      - {id: s2, pace: normal, text: "这样的分数要是有，{@m}就取分子分母最小的那一对。", en: "If such fractions exist, take the pair with the smallest numbers."}
      - {id: s3, pace: normal, text: "{@s}两边平方，a 方等于二倍的 b 方。", en: "Square both sides: a squared equals two times b squared."}
      - {id: s4, pace: normal, text: "画出来就是：{@a}边长 a 的大正方形，正好等于两个边长 b 的正方形。", en: "As a picture: a big square of side a exactly equals two squares of side b."}
    do:
      - {at: s1@f, act: show, target: f1}
      - {at: s2@m, act: mark, target: "f1#min"}
      - {at: s3@s, act: unmark, target: "f1#min"}
      - {with: prev, act: hide, target: f1}
      - {with: prev, act: show, target: f2}
      - {at: s4@a, act: shape, target: plane, args: {name: big, points: [[0, 0], [7, 0], [7, 7], [0, 7]], role: A, label: 'a^2'}}

  - id: Overlap
    say:
      - {id: s1, pace: normal, text: "{@p}把两个小正方形，{@q}放进大正方形的两个对角。", en: "Put the two smaller squares into opposite corners of the big one."}
      - {id: s2, pace: normal, text: "{@o}中间这块被盖了两次，{@c}另外两个角一点也没盖到。", en: "The middle is covered twice; the top-left and bottom-right corners aren't covered."}
      - {id: s3, pace: slow, text: "面积刚好相等，{@e}所以盖两次的这块，等于两个空角加起来。", en: "The areas match exactly, so the doubly covered square equals the two empty corners together."}
    do:
      - {at: s1@p, act: remove, target: plane, args: {name: [big]}}
      - {with: prev, act: shape, target: plane, args: {name: big2, points: [[0, 0], [7, 0], [7, 7], [0, 7]], role: A}}
      - {with: prev, act: shape, target: plane, args: {name: b1, points: [[0, 0], [4.9497, 0], [4.9497, 4.9497], [0, 4.9497]], role: C, fill: false}}
      - {at: s1@q, act: shape, target: plane, args: {name: b2, points: [[2.0503, 2.0503], [7, 2.0503], [7, 7], [2.0503, 7]], role: C, fill: false}}
      - {at: s2@o, act: shape, target: plane, args: {name: ov, points: [[2.0503, 2.0503], [4.9497, 2.0503], [4.9497, 4.9497], [2.0503, 4.9497]], role: HL, label: '(2b-a)^2'}}
      - {at: s2@c, act: shape, target: plane, args: {name: c1, points: [[0, 4.9497], [2.0503, 4.9497], [2.0503, 7], [0, 7]], role: "NO"}}
      - {with: prev, act: shape, target: plane, args: {name: c2, points: [[4.9497, 0], [7, 0], [7, 2.0503], [4.9497, 2.0503]], role: "NO"}}
      - {at: s3@e, act: hide, target: f2}
      - {with: prev, act: show, target: f3}

  - id: Predict
    pause: {type: predict, prompt: 这个等式，是不是有点眼熟？, hold: 3, app_item: ep20-why-1}
    say:
      - {id: s1, pace: ask, text: "这个等式，是不是有点眼熟？", en: "Does this equation look familiar?"}

  - id: Descent
    say:
      - {id: s1, pace: normal, text: "又是一个正方形等于两个正方形，{@s}跟 a 方等于二倍 b 方一模一样。", en: "Again one square equals two squares, exactly like a squared equals twice b squared."}
      - {id: s2, pace: normal, text: "新的边长是二 b 减 a 和 a 减 b，{@n}它们也是正整数，而且更小。", en: "The new sides are two b minus a and a minus b: whole numbers again, and smaller."}
      - {id: s3, pace: normal, text: "可我们说好 a 和 b 是最小的一对，{@x}这就矛盾了。", en: "But we said a and b were the smallest pair. That's a contradiction."}
      - {id: s4, pace: normal, text: "{@d}在中间那块里还能再摆一次，{@e}一层比一层小，正整数却不能一直变小。", en: "We could do it again inside the middle square, smaller and smaller, but whole numbers can't keep shrinking."}
    do:
      - {at: s1@s, act: mark, target: "f3#l"}
      - {at: s2@n, act: unmark, target: "f3#l"}
      - {with: prev, act: mark, target: "f3#r"}
      - {at: s3@x, act: unmark, target: "f3#r"}
      - {at: s4@d, act: remove, target: plane, args: {name: [ov]}}
      - {with: prev, act: shape, target: plane, args: {name: ov1, points: [[2.0503, 2.0503], [4.9497, 2.0503], [4.9497, 4.9497], [2.0503, 4.9497]], role: HL}}
      - {after: prev, act: shape, target: plane, args: {name: d1, points: [[2.0503, 2.0503], [4.1005, 2.0503], [4.1005, 4.1005], [2.0503, 4.1005]], role: C, fill: false}}
      - {with: prev, act: shape, target: plane, args: {name: d2, points: [[2.8995, 2.8995], [4.9497, 2.8995], [4.9497, 4.9497], [2.8995, 4.9497]], role: C, fill: false}}
      - {at: s4@e, act: shape, target: plane, args: {name: e1, points: [[2.8995, 2.8995], [3.7487, 2.8995], [3.7487, 3.7487], [2.8995, 3.7487]], role: C, fill: false}}
      - {with: prev, act: shape, target: plane, args: {name: e2, points: [[3.2513, 3.2513], [4.1005, 3.2513], [4.1005, 4.1005], [3.2513, 4.1005]], role: C, fill: false}}

  - id: NonExample
    shows: non_example
    say:
      - {id: s1, pace: normal, text: "{@c}那七比五呢？{@a}七的平方四十九，{@b}五的平方的两倍是五十。", en: "What about seven fifths? Seven squared is forty-nine; twice five squared is fifty."}
      - {id: s2, pace: normal, text: "{@x}差一点就不是相等，再接近的分数，也只是差得更少。", en: "Off by a bit is not equal; closer fractions are only off by less."}
    do:
      - {at: s1@c, act: hide, target: f3}
      - {at: s1@a, act: show, target: "f4"}
      - {at: s2@x, act: cross, target: "myth#m"}

  - id: Landing
    shows: landing
    say:
      - {id: s1, pace: slow, text: "{@c}所以根号二不能写成分数，它是一个无理数。", en: "So root two can't be written as a fraction. It is an irrational number."}
      - {id: s2, pace: normal, text: "这是证明，只用到了面积，和正整数不能无限变小。", en: "This is a proof, using only area and the fact that whole numbers can't shrink forever."}
    do:
      - {at: s1@c, act: hide, target: f4}
      - {with: prev, act: show, target: f3}

  - id: Close
    say:
      - {id: s1, pace: ask, text: "那根号三呢？这张图还能照着用吗？", en: "And root three? Can this picture be reused?"}
