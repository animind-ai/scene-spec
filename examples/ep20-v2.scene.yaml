# v2 版式副本：与 ep20.scene.yaml 相同，只加 style.layout: v2（无右侧栏、顶栏 1.0、满宽 stage；字幕仍是双语两行烧录带）。
# 洞察系列 #20 √2 为什么不是分数（八年级）。单集。三角形折叠版 + 情境开场（2026-10-18 用户定：「换回三角形折叠版，改成情境开场」）。
# 按脚本 insight/ep20-sqrt2-irrational/script.yaml 写。留档：第 1 版正方形 ep20-v1-squares，第 3 版找尺子 ep20-v3-ruler。
# 开场：边长为一的正方形纸沿对角线对折（dissect 的 fold），折痕长 √2；问它能不能正好写成分数，停三秒；同桌拿尺子量 1.414，
# 说"量得再细点，总能凑出一个分数"（迷思）。对折后的纸就是后面的等腰直角三角形，同一个 view、同一个位置。
# 一个洞察（几何无穷递降）：假设 √2 = a/b、b 最小，a² = b² + b²：直角边 b、斜边 a 的等腰直角三角形；沿上面那个角的平分线
# 把左边的直角边折到斜边上，斜边剩 a − b，右下角切出直角边 a − b、斜边 2b − a 的小等腰直角三角形；
# 1 < √2 < 2 ⇒ b < a < 2b，新边长是更小的正整数，矛盾。再折一次表示一直缩小。
# 画法：直角在 C(0,0)，B(5,0)，A(0,5)（b = 5 个图形单位），D = (5√2 − 5, 0)，C 折到 E = (5/√2, 5 − 5/√2)；
# 第二次在 △DEB 里沿 D 角的平分线折，折痕 D→F，E 落到 G = (2·DE, 0) = F 的正下方。
# 预测暂停"边长还是整数吗"；非例 7/5：49 和 50 差 1；落到 √2 是无理数，说明这是证明；
# 结尾问 √2 的小数会不会循环（不问 √3：这个折法对 √3 不能照搬）。
spec: "0.1"

meta:
  id: ep20
  title: √2 为什么不是分数
  line: insight
  units: [J5]
  episode: 20
  grade: 八年级
  author: Boxi Yu
  license: CC-BY-4.0

pedagogy:
  insight: 假设根号二等于 a 比 b 且 b 最小，就有直角边 b、斜边 a 的等腰直角三角形；把直角边折到斜边上，切出直角边 a 减 b、斜边二 b 减 a 的小等腰直角三角形，边长是更小的正整数，矛盾
  misconception: 分数可以无限接近根号二，差不多就是分数了
  non_example: 七比五很接近，但七的平方四十九，五的平方的两倍是五十，差一就不是相等
  status: proof
  landing: Landing

style:
  side: column  # v2 改版：侧栏内容放回主讲区右边一栏，顶栏只留一行问题句
  layout: v2  # 培玉视觉规范 v2（style-v2 批量重渲，2026-10-20）
  theme: paper
  canvas: "16:9"
  voice:
    persona: teacher-hs
    speed: 1.0
  segmented: true
  step_hold: 1.0

objects:
  q:
    type: text
    text: '$\sqrt{2}=\dfrac{?}{?}$'
    level: title
    in: top
  myth:
    in: side
    type: text
    text: '[量细点总能凑出分数？]{#m}'
    role: "NO"
    level: title
  # 开场的纸：正方形沿对角线对折，折好就是后面 tri 的三角形（同一个 view，换对象时位置不动）
  paper:
    widget: dissect
    role: A
    over: tri
    view: [[-0.7, -0.75], [5.8, 5.15]]
    shapes:
      S: {rect: [5, 5]}
    cuts:
      d: {piece: S, line: [[0, 5], [5, 0]], into: [half, top]}
    guides:
      one: {from: [0, 0], to: [5, 0], label: '$1$', side: below, solid: true}
      diag: {from: [0, 5], to: [5, 0], label: '折痕 $\sqrt{2}$', role: HL, solid: true, side: right}
  tri:
    widget: dissect
    role: A
    in: stage
    view: [[-0.7, -0.75], [5.8, 5.15]]
    shapes:
      T:
        polygon: [[0, 0], [5, 0], [0, 5]]
        edges:
          - {at: [[0, 0], [0, 5]], text: '$b$'}
          - {at: [[0, 0], [5, 0]], text: '$b$'}
          - {at: [[0, 5], [5, 0]], text: '$a$'}
    cuts:
      # 折痕：A 角的平分线 A→D；落点 E 处的竖边 D→E；第二次折痕：D 角的平分线 D→F
      f1: {piece: T, line: [[0, 5], [2.0710678, 0]], into: [flap, rest]}
      c2: {piece: rest, line: [[2.0710678, 0], [3.5355339, 1.4644661]], into: [under, small]}
      f2: {piece: small, line: [[2.0710678, 0], [4.1421356, 0.8578644]], into: [flap2, rest2]}
    pieces:
      flap: {edges: [{at: [[0, 5], [0, 0]], text: '$b$'}]}
      small: {role: HL}
    guides:
      eb: {from: [3.5355339, 1.4644661], to: [5, 0], label: '$a-b$', role: HL, solid: true, side: above}
      ed: {from: [3.5355339, 1.4644661], to: [2.0710678, 0], label: '$a-b$', role: HL, solid: true, side: left}
      cd: {from: [0, 0], to: [2.0710678, 0], label: '$a-b$', role: C, solid: true, side: below}
      db: {from: [2.0710678, 0], to: [5, 0], label: '$2b-a$', role: HL, solid: true, side: below}
  f1:
    type: text
    text: '$\sqrt{2}=\dfrac{a}{b}$'
    level: title
    in: side
  fmin:
    type: text
    text: '[$b$ 最小]{#min}'
    level: title
    below: f1
    gap: sm
  f2:
    type: text
    text: '$a^2=b^2+b^2$'
    level: title
    below: fmin
    gap: md
  f3:
    type: text
    text: '$b<a<2b$'
    level: title
    below: f2
    gap: md
  f5:
    type: text
    text: '$0<a-b<b$'
    role: HL
    level: title
    below: f3
    gap: sm
  f4a:
    type: text
    text: '$7^2=49$'
    role: "NO"
    level: title
    in: side
  f4b:
    type: text
    text: '$2\times 5^2=50$'
    role: "NO"
    level: title
    below: f4a
    gap: sm

i18n:
  en:
    meta: {title: "Why √2 Is Not a Fraction"}
    objects:
      myth: {text: '[Measure finer and a fraction fits?]{#m}', in: footer}  # v2 英文版：句子长，放底栏（这一集底栏空着），不和右栏的算式叠挤
      fmin: {text: '[$b$ smallest]{#min}'}
      paper: {guides: {diag: {label: 'Crease $\sqrt{2}$'}}}
    beats:
      Hook: {pause: {prompt: "The crease is root two long. Can it be written exactly as a fraction?"}}
      Predict: {pause: {prompt: "Are this small triangle's sides still whole numbers?"}}

beats:
  - id: Hook
    pause: {type: predict, prompt: 折痕长根号二，它能正好写成一个分数吗？, hold: 3, app_item: ep20-before-1}
    say:
      - {id: s1, pace: normal, text: "{@p}边长为一的正方形纸，{@f}沿对角线对折，{@c}折痕长根号二。", en: "{@p}A square sheet of paper with side one: {@f}fold it along the diagonal. {@c}The crease is root two long."}
      - {id: s2, pace: ask, text: "{@q}先别急，心里站个队：它能正好写成一个分数吗？", en: "{@q}Don't rush; pick a side in your head: can it be written exactly as a fraction?"}
    do:
      - {at: s1@p, act: show, target: paper}
      - {with: prev, act: show, target: "paper#one"}
      - {at: s1@f, act: fold, target: paper, args: {cut: d, flap: top, back: C}, dur: 1.6}
      - {at: s1@c, act: show, target: "paper#diag"}
      - {at: s2@q, act: show, target: q}

  - id: Myth
    shows: misconception
    say:
      - {id: s1, pace: normal, text: "同桌拿尺子一量，一点四一四，{@m}说量得再细点，总能凑出一个分数。", en: "Your deskmate measures it with a ruler, gets one point four one four, and says: {@m}measure finely enough and some fraction will fit."}
    do:
      - {at: s1@m, act: show, target: myth}

  - id: Setup
    say:
      - {id: s1, pace: normal, text: "我们先假设，{@f}根号二等于 a 比 b，a 和 b 都是正整数。", en: "First suppose {@f}root two equals a over b, with a and b whole numbers."}
      - {id: s2, pace: normal, text: "这样的分数要是有，{@m}就取分母 b 最小的那一个。", en: "If such fractions exist, {@m}take the one whose denominator b is smallest."}
      - {id: s3, pace: normal, text: "{@s}两边平方，a 方等于 b 方加 b 方。", en: "{@s}Square both sides: a squared equals b squared plus b squared."}
      - {id: s4, pace: normal, text: "按勾股定理，{@t}这就是一个等腰直角三角形，两条直角边是 b，斜边是 a。", en: "By Pythagoras, {@t}that's an isosceles right triangle: both legs b, hypotenuse a."}
    do:
      - {at: s1@f, act: show, target: f1}
      - {at: s2@m, act: show, target: fmin}
      - {with: prev, act: mark, target: fmin}
      - {at: s3@s, act: unmark, target: fmin}
      - {with: prev, act: show, target: f2}
      - {at: s4@t, act: hide, target: paper, dur: 0.3}
      - {with: prev, act: show, target: tri, dur: 0.3}

  - id: Fold
    say:
      - {id: s1, pace: normal, text: "{@f}沿着上面这个角的平分线折一下，让左边的直角边贴到斜边上。", en: "{@f}Fold along the bisector of the top angle, so the left leg lies flat on the hypotenuse."}
      - {id: s2, pace: normal, text: "折过去的这条边长 b，斜边长 a，{@r}所以斜边上还剩一段 a 减 b。", en: "The folded leg is b long and the hypotenuse is a, so {@r}a piece a minus b is left over."}
      - {id: s3, pace: normal, text: "原来的直角落在了斜边上，{@c}所以右下角切出了一个小三角形。", en: "The right angle now sits on the hypotenuse, and {@c}it cuts off a small triangle in the bottom right."}
    do:
      - {at: s1@f, act: fold, target: tri, args: {cut: f1, flap: flap, back: C}, dur: 2.0}
      - {at: s2@r, act: show, target: "tri#eb"}
      - {at: s3@c, act: cut, target: tri, args: {cut: c2}, dur: 1.0}

  - id: Predict
    pause: {type: predict, prompt: 这个小三角形，边长还是整数吗？, hold: 3, app_item: ep20-fold-why-1}
    say:
      - {id: s1, pace: ask, text: "这个小三角形，边长还是整数吗？", en: "Are this small triangle's sides still whole numbers?"}

  - id: Count
    say:
      - {id: s1, pace: normal, text: "它的右下角也是四十五度，所以两条直角边一样长，{@e}都是 a 减 b。", en: "Its bottom-right angle is also forty-five degrees, so its two legs are equal: {@e}both a minus b."}
      - {id: s2, pace: normal, text: "{@l}底边左边那段折上去就是这条边，也是 a 减 b，{@h}剩下的斜边是二 b 减 a。", en: "{@l}The left part of the bottom edge folded up into that leg, so it's a minus b too, and {@h}the rest, the small hypotenuse, is two b minus a."}
      - {id: s3, pace: normal, text: "再看大小：一小于根号二小于二，{@i}所以 b 小于 a 小于二 b。", en: "Now sizes: one is less than root two, which is less than two, so {@i}b is less than a, which is less than two b."}
      - {id: s4, pace: normal, text: "于是 a 减 b 和二 b 减 a 都是正整数，{@p}而且 a 减 b 比 b 小。", en: "So a minus b and two b minus a are both positive whole numbers, and {@p}a minus b is smaller than b."}
      - {id: s5, pace: normal, text: "又是一个整数边的等腰直角三角形，直角边却比 b 还小，{@x}这就矛盾了。", en: "Again an isosceles right triangle with whole-number sides, but with legs shorter than b. {@x}That's a contradiction."}
    do:
      - {at: s1@e, act: show, target: "tri#ed"}
      - {at: s2@l, act: show, target: "tri#cd"}
      - {at: s2@h, act: show, target: "tri#db"}
      - {at: s3@i, act: show, target: f3}
      - {at: s4@p, act: show, target: f5}
      - {at: s5@x, act: mark, target: fmin}

  - id: Again
    say:
      - {id: s1, pace: normal, text: "{@f}在小三角形里还能再折一次，{@e}一个比一个小，正整数却不能一直变小。", en: "{@f}We can fold the small one again, {@e}smaller and smaller, but whole numbers can't keep shrinking."}
    do:
      - {at: s1, act: unmark, target: fmin}
      - {with: prev, act: hide, target: "tri#eb"}
      - {with: prev, act: hide, target: "tri#ed"}
      - {with: prev, act: hide, target: "tri#cd"}
      - {with: prev, act: hide, target: "tri#db"}
      - {at: s1@f, act: fold, target: tri, args: {cut: f2, flap: flap2, back: C}, dur: 1.8}

  - id: NonExample
    shows: non_example
    say:
      - {id: s1, pace: normal, text: "{@c}那七比五呢？{@a}七的平方四十九，{@b}五的平方的两倍是五十。", en: "{@c}What about seven fifths? {@a}Seven squared is forty-nine; {@b}twice five squared is fifty."}
      - {id: s2, pace: normal, text: "{@x}差一点就不是相等，再接近的分数，也只是差得更少。", en: "{@x}Off by a bit is not equal; closer fractions are only off by less."}
    do:
      - {at: s1@c, act: hide, target: f1}
      - {with: prev, act: hide, target: fmin}
      - {with: prev, act: hide, target: f2}
      - {with: prev, act: hide, target: f3}
      - {with: prev, act: hide, target: f5}
      - {at: s1@a, act: show, target: f4a}
      - {at: s1@b, act: show, target: f4b}
      - {at: s2@x, act: cross, target: "myth#m"}

  - id: Landing
    shows: landing
    say:
      - {id: s1, pace: slow, text: "{@c}所以根号二不能写成分数，它是一个无理数。", en: "{@c}So root two can't be written as a fraction. It is an irrational number."}
      - {id: s2, pace: normal, text: "这是一个证明，只用到了折纸，和正整数不能一直变小。", en: "This is a proof, using only a fold and the fact that whole numbers can't shrink forever."}
    do:
      - {at: s1@c, act: hide, target: f4a}
      - {with: prev, act: hide, target: f4b}
      - {with: prev, act: show, target: f1}
      - {with: prev, act: show, target: fmin}
      - {with: prev, act: show, target: f2}
      - {with: prev, act: show, target: f3}
      - {with: prev, act: show, target: f5}

  - id: Close
    say:
      - {id: s1, pace: ask, text: "那根号二写成小数，会不会从某一位开始循环？", en: "So when root two is written as a decimal, could it start repeating at some point?"}
