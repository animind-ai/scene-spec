# 洞察系列 #9 分数除法为什么"颠倒相乘"（分数小系列第四集，三到五年级）。
# 和 examples/ep09.scene.yaml 是同一集的两个版本：那一份是早先的单集样片（回归测试在用，不动），
# 这一份按分数小系列第 2 轮脚本（insight/ep09-fraction-division/script.yaml）写，开场接 #8 的片尾画面。
# 开场：0–1 数轴、顶部 6 ÷ 2/3 = ?；钩子先猜、再说出"除法一定让数变小"；数轴拉长到 0–6；
# 按错误想法只跳五个 2/3：连 4 都不到，打叉；只看 0 到 1：切三份、两份一跳，预测暂停后看出 1 里面有一个半（3/2 个）；
# 六个一就有九跳，比 6 大；非例 6 ÷ 3/2 只有四跳（上一组九跳留成残影对照）；
# 落到算式：6 ÷ 2/3 = 6 × 3/2 = 9，和"通分后分子相除"18 ÷ 2 = 9 并排，轴下 18 格两格一组正好九组；
# 结尾回扣整个系列：四集的算式依次出现，都是"换一个合适的单位去量"。英文字幕一句对一句写在每句的 en 里（双语字幕的第二行）。
spec: "0.1"

meta:
  id: ep09
  title: 分数除法为什么"颠倒相乘"
  line: insight
  units: [P6]
  episode: 9
  grade: 三到五年级
  author: Boxi Yu
  license: CC-BY-4.0

pedagogy:
  insight: 除以三分之二就是数六里面有几个三分之二；每个一里面有二分之三个，所以六里面有六乘二分之三个
  misconception: 除法一定让数变小
  non_example: 除以比一大的数（六除以二分之三）结果才变小，只有四个
  status: proof
  landing: Landing

style:
  theme: paper
  canvas: "16:9"
  voice:
    persona: friend-ps
    speed: 1.0
  segmented: true
  step_hold: 1.0

objects:
  # 开场用的问题：单独占 top，位置和上一集片尾的同一行字一致；Myth 段变形成下面带一行小字的 q
  q0:
    type: text
    text: '$6\div\dfrac{2}{3}=\ ?$'
    level: title
    in: top
  q:
    type: text
    text: '$6\div\dfrac{2}{3}=\ ?$'
    level: title
    in: top
  myth:
    type: text
    text: 除法一定让数变小？
    role: "NO"
    below: q
    gap: sm
  line:
    widget: number_line
    range: [0, 1]
    parts: 1
    fractions: true
    measures: ["1/4"]
    unit: 9
    bars: true
    role: A
    in: stage
  line6:
    widget: number_line
    range: [0, 6]
    parts: 1
    measures: ["2/3", "3/2"]
    bars: true
    role: A
    in: stage
  ask:
    type: text
    text: '$6$ 里面有几个 [$\dfrac{2}{3}$]{#d .A}？'
    level: title
    in: footer
  inone:
    type: text
    text: '$1$ 里面有 [$\dfrac{3}{2}$]{#n .HL} 个 $\dfrac{2}{3}$'
    level: title
    in: footer
  q2:
    type: text
    text: '[$6\div\dfrac{3}{2}=\ ?$]{#q}'
    level: title
    in: footer
  eq:
    type: text
    text: '[$6\div\dfrac{2}{3}$]{#lhs} [$=6\times\dfrac{3}{2}$]{#flip .HL} [$=9$]{#ans}'
    level: title
    in: footer
  eq2:
    type: text
    text: '[$=\dfrac{18}{3}\div\dfrac{2}{3}=18\div 2=9$]{#all .B}'
    level: title
    right_of: eq
    gap: lg
  recap:
    type: text
    text: '[$\dfrac{1}{2}=\dfrac{2}{4}$]{#a}　·　[$\dfrac{1}{2}+\dfrac{1}{3}=\dfrac{5}{6}$]{#b}　·　[$\dfrac{2}{3}\times\dfrac{3}{4}=\dfrac{1}{2}$]{#c}　·　[$6\div\dfrac{2}{3}=9$]{#d}'
    level: title
    in: top
  motto:
    type: text
    text: 换一个合适的单位去量
    role: HL
    below: recap
    gap: sm

i18n:
  en:
    meta: {title: "Why Dividing by a Fraction Means Flip and Multiply"}
    objects:
      myth: {text: "Dividing always makes things smaller?"}
      ask: {text: 'How many [$\dfrac{2}{3}$]{#d .A} in $6$?'}
      inone: {text: '$1$ holds [$\dfrac{3}{2}$]{#n .HL} of $\dfrac{2}{3}$'}
      recap: {text: '[$\dfrac{1}{2}=\dfrac{2}{4}$]{#a}  ·  [$\dfrac{1}{2}+\dfrac{1}{3}=\dfrac{5}{6}$]{#b}  ·  [$\dfrac{2}{3}\times\dfrac{3}{4}=\dfrac{1}{2}$]{#c}  ·  [$6\div\dfrac{2}{3}=9$]{#d}'}
      motto: {text: "Measure with a better unit"}
    beats:
      Hook: {pause: {prompt: "A 6 m ribbon cut into 2/3 m pieces: more or fewer than six pieces?"}}
      Predict: {pause: {prompt: "How many 2/3 fit inside 1?"}}

beats:
  - id: Hook
    pause: {type: predict, prompt: 6 米彩带每 2/3 米一段，比六段多还是少？, hold: 3, app_item: ep09-before-1}
    say:
      - {id: s1, pace: ask, text: "六米长的彩带，每三分之二米剪一段，{@q}能剪几段？", en: "A ribbon six meters long, cut into pieces two thirds of a meter each. {@q}How many pieces?"}
      - {id: s2, pace: normal, text: "比六段多，还是比六段少？你先选一个。", en: "More than six pieces, or fewer? Pick one first."}
    do:
      # 开场：#8 的片尾画面
      - {at: s1, act: show, target: line, dur: 0.01}
      - {with: prev, act: show, target: q0, dur: 0.01}
      - {at: s1@q, act: mark, target: q0}

  - id: Myth
    shows: misconception
    say:
      - {id: s1, pace: normal, text: "小林摇摇头：{@m}除法会让数变小，肯定不到六段。", en: "Lin shakes their head: {@m}dividing makes things smaller, so it's fewer than six."}
    do:
      - {at: s1, act: unmark, target: q0}
      - {after: prev, act: transform, from: q0, to: q}
      - {with: prev, act: hide, target: q0}
      - {at: s1@m, act: show, target: myth}

  # Setup 拆成两段：0–1 数轴要和 ask（footer）同在一段里，排版才和 #8 片尾一致（区域占用按 beat 算）
  - id: Setup
    say:
      - {id: s1, pace: normal, text: "除法问的是，{@ask}六里面有几个三分之二。", en: "Division is asking: {@ask}how many two thirds fit inside six?"}
    do:
      - {at: s1@ask, act: show, target: ask}

  - id: Stretch
    say:
      - {id: s2, pace: normal, text: "{@long}把数轴拉长，从零一直延伸到六，{@one}每一格是一。", en: "{@long}Let's stretch the number line all the way from zero to six, {@one}one unit per step."}
    do:
      - {at: s2@long, act: transform, from: line, to: line6}
      - {with: prev, act: hide, target: line}
      - {at: s2@one, act: highlight, target: line6, args: {to: 1, role: A}, dur: 0.6}
      - {after: prev, act: hold, dur: 0.6}
      - {after: prev, act: hide, target: "line6.span[0]"}

  - id: WrongIdea
    shows: misconception
    say:
      - {id: s1, pace: ask, text: "如果答案比六小，{@five}比如说五个，够不够？", en: "If the answer were less than six, say {@five}five, would that be enough?"}
      - {id: s2, pace: normal, text: "{@short}五个三分之二接起来，连四都不到，{@far}离六还远着呢。", en: "{@short}Five two thirds end to end don't even reach four. {@far}Six is still a long way off."}
    do:
      - {at: s1@five, act: jump, target: line6, args: {length: "2/3", count: 5, role: "NO"}, dur: fit}
      - {at: s2@short, act: focus, target: "line6.jump[4]"}
      - {at: s2@far, act: unfocus, target: line6}
      - {with: prev, act: cross, target: "line6.jump[4]"}
      - {after: prev, act: hold, dur: 0.8}
      - {after: prev, act: clear, target: line6}
      - {with: prev, act: erase, target: line6}

  - id: OneUnit
    say:
      - {id: s1, pace: normal, text: "我们先只看零到一这一段，{@cut}把它平均切成三份。", en: "Let's look at just zero to one first, and {@cut}cut it into three equal parts."}
      - {id: s2, pace: normal, text: "{@two}两份，就是一个三分之二。", en: "{@two}Two of those parts make one two thirds."}
    do:
      - {at: s1, act: focus, target: "line6.unit[0]"}
      - {at: s1@cut, act: subdivide, target: line6, args: {parts: 3}, dur: 1.2}
      - {at: s2@two, act: jump, target: line6, args: {length: "2/3", count: 1}, dur: 1.0}

  - id: Predict
    pause: {type: predict, prompt: 1 里面能放下几个 2/3？, hold: 3, app_item: ep09-predict-1}
    say:
      - {id: s1, pace: ask, text: "一里面，{@q}能放下几个三分之二？", en: "So {@q}how many two thirds fit inside one?"}

  - id: Half
    say:
      - {id: s1, pace: normal, text: "{@one}放下一个，{@left}还剩一份，这一份正好是半个三分之二。", en: "{@one}One fits, with {@left}one part left over, and that part is exactly half of a two thirds."}
      - {id: s2, pace: slow, text: "所以一里面，{@h}有一个半，也就是二分之三个。", en: "So one holds {@h}one and a half of them: three halves."}
      - {id: s3, pace: normal, text: "每一个一里面都一样。{@six}六个一，就有六个一个半。", en: "Every unit is the same. {@six}Six units hold six lots of one and a half."}
    do:
      - {at: s1@left, act: highlight, target: line6, args: {from: "2/3", to: 1, role: B}, dur: 0.8}
      - {at: s2@h, act: hide, target: ask}
      - {after: prev, act: show, target: inone}
      - {at: s3, act: step}        # 子步：1 里面有 3/2 个
      - {at: s3@six, act: unfocus, target: line6}
      - {with: prev, act: hide, target: "line6.span[0]"}

  - id: Count
    say:
      - {id: s1, pace: brisk, text: "{@c}一、二、三、四、五、六、七、八、九。", en: "{@c}One, two, three, four, five, six, seven, eight, nine."}
      - {id: s2, pace: slow, text: "{@nine}九个！{@big}比六还大。", en: "{@nine}Nine! {@big}More than six."}
    do:
      - {at: s1@c, act: jump, target: line6, args: {length: "2/3"}, dur: fit}
      - {at: s2@nine, act: mark, target: "line6.count[8]"}
      - {at: s2@big, act: cross, target: myth}
      - {after: prev, act: hold, dur: 1.5}

  - id: NonExample
    shows: non_example
    say:
      - {id: s1, pace: ask, text: "{@q}换一个比一大的除数，六除以二分之三，会怎样？", en: "{@q}Now divide by something bigger than one. What happens with six divided by three halves?"}
      - {id: s2, pace: normal, text: "{@cut}每个一里面只放得下三分之二个，{@four}六里面就只有四个，{@small}变小了。", en: "{@cut}Each unit only holds two thirds of one, so {@four}six holds just four. {@small}Smaller this time."}
      - {id: s3, pace: normal, text: "所以，{@only}只有除以比一大的数，结果才会变小。", en: "So {@only}the result only gets smaller when you divide by something bigger than one."}
    do:
      - {at: s1, act: unmark, target: "line6.count[8]"}
      - {with: prev, act: hide, target: inone}
      - {with: prev, act: hide, target: myth}
      - {with: prev, act: ghost, target: line6, args: {place: above, gap: lg, scale: 0.75}}   # 九跳留在上方对照
      - {with: prev, act: erase, target: line6}
      - {at: s1@q, act: show, target: q2}
      - {at: s2@cut, act: subdivide, target: line6, args: {parts: 2}, dur: 1.0}
      - {at: s2@four, act: jump, target: line6, args: {length: "3/2", role: C}, dur: fit}
      - {at: s2@small, act: mark, target: "line6.count[3]"}
      - {at: s3, act: step}
      - {after: prev, act: hold, dur: 1}

  - id: Landing
    shows: landing
    say:
      - {id: s1, pace: normal, text: "每个一里有二分之三个，{@so}所以除以三分之二，就是乘二分之三。", en: "Every unit holds three halves of them, so {@so}dividing by two thirds is the same as multiplying by three halves."}
      - {id: s2, pace: normal, text: "还有一种做法，{@rn}先通分。六是三分之十八，{@grp}两份一组，正好九组。", en: "Or {@rn}rename first: six is eighteen thirds, and {@grp}grouping them two at a time gives exactly nine groups."}
    do:
      - {at: s1, act: unmark, target: "line6.count[3]"}
      - {with: prev, act: unghost, target: line6}
      - {with: prev, act: erase, target: line6}
      - {with: prev, act: hide, target: q2}
      - {after: prev, act: subdivide, target: line6, args: {parts: 3}, dur: 0.6}
      - {after: prev, act: jump, target: line6, args: {length: "2/3"}, dur: 1.0}
      - {with: prev, act: hide, target: "eq#flip"}
      - {with: prev, act: hide, target: "eq#ans"}
      - {with: prev, act: set, target: eq, args: {opacity: 1}}
      - {at: s1@so, act: show, target: "eq#flip"}
      - {after: prev, act: show, target: "eq#ans"}
      - {at: s2@rn, act: show, target: eq2}
      - {with: prev, act: bar, target: line6, args: {parts: 3}}
      - {after: prev, act: fill, target: line6, args: {cells: "0:18", role: A}}
      - {at: s2@grp, act: group, target: line6, args: {size: 2}, dur: fit}

  - id: Close
    say:
      - {id: s1, pace: normal, text: "所以除法不一定让数变小，{@m}要看除的是什么数。", en: "So dividing doesn't always make things smaller. It {@m}depends on what you divide by."}
      - {id: s2, pace: slow, text: "{@four}这四集，我们一直在做同一件事，{@unit}换一个合适的单位去量。", en: "{@four}Across these four episodes, we've really been doing one thing: {@unit}measuring with a better unit."}
    do:
      - {at: s1, act: show, target: myth}
      - {after: prev, act: cross, target: myth}
      - {at: s1@m, act: focus, target: "eq#flip"}
      - {at: s2@four, act: unfocus, target: eq}
      - {with: prev, act: hide, target: q}
      - {with: prev, act: hide, target: myth}
      - {after: prev, act: show, target: recap}
      - {after: prev, act: mark, target: "recap#a", dur: 0.5}
      - {after: prev, act: unmark, target: "recap#a", dur: 0.3}
      - {with: prev, act: mark, target: "recap#b", dur: 0.5}
      - {after: prev, act: unmark, target: "recap#b", dur: 0.3}
      - {with: prev, act: mark, target: "recap#c", dur: 0.5}
      - {after: prev, act: unmark, target: "recap#c", dur: 0.3}
      - {with: prev, act: mark, target: "recap#d", dur: 0.5}
      - {at: s2@unit, act: show, target: motto}
      - {after: prev, act: hold, dur: 2}
