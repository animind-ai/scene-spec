# 洞察系列 #15 负负得正（七年级）。按脚本 insight/ep15-negative-times-negative/script.yaml（第 2 轮，方案 A）写。
# 一个洞察：数是从 0 出发的箭头，乘正数是拉长，乘 −1 是绕 0 转半圈（number_line 的 arrow / stretch / turn，画面真转）。
# 钩子问 (−2)×(−3) 为什么是 +6、停三秒、说出"没有道理"；3×2 拉长到 6；3×(−1) 转到左，(−3)×(−1) 转回右；
# 规律表只到 0×(−3)=0，作预测暂停；(−2)×(−3) = (−1)×2 × (−1)×3：拉长到 6、转两次回到 +6；
# 非例：(−2)+(−3) = −5，负号不抵消；结尾：是约定，但只有这样约定别的规则才不会坏；埋 #33（转四分之一圈）。
spec: "0.1"

meta:
  id: ep15
  title: 负负得正
  line: insight
  units: [J1]
  episode: 15
  grade: 七年级
  author: Boxi Yu
  license: CC-BY-4.0

pedagogy:
  insight: 把数看成从零出发的箭头：乘正数是拉长，乘负一是绕零转半圈；负二乘负三就是拉长到六、再转两次半圈，转回正六
  misconception: 负负得正没有道理，背下来就行；两个负号会抵消，所以负二加负三是正五
  non_example: 加法里没有负负得正：负二加负三是从负二再往左走三格，到负五
  status: proof
  landing: Landing

style:
  theme: paper
  canvas: "16:9"
  voice:
    persona: peer-ms
    speed: 1.0
  segmented: true
  step_hold: 1.0

objects:
  q:
    type: text
    text: '$(-2)\times(-3)=+6\ ?$'
    level: title
    in: top
  myth:
    type: text
    text: '[没有道理？]{#m}'
    role: "NO"
    level: title
    right_of: q
    gap: lg
  line:
    widget: number_line
    range: [-6, 6]
    parts: 1
    arrows: true
    role: A
    in: stage
  # 算式都在底栏，一行从左往右排（侧栏不用，数轴才有整个画面宽）
  s1:
    type: text
    text: '$3\times 2=6$'
    level: title
    in: footer
  t1:
    type: text
    text: '[$3\times(-1)$]{#l} [$=-3$]{#r}'
    level: title
    in: footer
  t2:
    type: text
    text: '[$(-3)\times(-1)$]{#l} [$=3$]{#r .HL}'
    level: title
    right_of: t1
    gap: lg
  # 规律表：预测暂停那两段数轴先收起，表在主讲区一行一行往下
  r1:
    type: text
    text: '$2\times(-3)=-6$'
    level: display
    in: stage
  r2:
    type: text
    text: '$1\times(-3)=-3$'
    level: display
    below: r1
    gap: sm
  r3:
    type: text
    text: '$0\times(-3)=0$'
    level: display
    below: r2
    gap: sm
  r4q:
    type: text
    text: '[$(-1)\times(-3)=$]{#l} [$?$]{#q .NO}'
    level: display
    below: r3
    gap: sm
  r4:
    type: text
    text: '[$(-1)\times(-3)=$]{#l} [$3$]{#q .HL}'
    level: display
    below: r3
    gap: sm
  eq1:
    type: text
    text: '[$(-2)\times(-3)$]{#l} [$=(-1)\times 2\times(-1)\times 3$]{#split}'
    level: title
    in: footer
  eq2:
    type: text
    text: '[$(-2)\times(-3)$]{#l} [$=6\times(-1)\times(-1)$]{#turns} [$=6$]{#res .HL}'
    level: title
    in: footer
  add:
    type: text
    text: '[$(-2)+(-3)$]{#l} [$=-5$]{#r .NO}'
    level: title
    in: footer

beats:
  - id: Hook
    pause: {type: predict, prompt: 负二乘负三为什么是正六？先猜一猜。, hold: 3, app_item: ep15-before-1}
    say:
      - {id: s1, pace: ask, text: "{@q}负二乘负三，为什么是正六？", en: "Negative two times negative three: why is it positive six?"}
      - {id: s2, pace: normal, text: "先猜一猜，想三秒钟。", en: "Take a guess. Think for three seconds."}
    do:
      - {at: s1@q, act: show, target: q}

  - id: Myth
    shows: misconception
    say:
      - {id: s1, pace: normal, text: "很多人说，{@m}负负得正没有道理，背下来就行。", en: "Lots of people say there's no reason behind it. You just memorise it."}
    do:
      - {at: s1@m, act: show, target: myth}

  - id: Setup
    say:
      - {id: s1, pace: normal, text: "我们一起看。把数画成从零出发的箭头，{@a}三就指向三。", en: "Let's look together. Draw a number as an arrow from zero. Three points to three."}
      - {id: s2, pace: normal, text: "乘一个正数是把箭头拉长：{@s}三乘二，就拉长到六。", en: "Multiplying by a positive number stretches it: three times two stretches it to six."}
    do:
      # 数轴从这里活到 Landing：开头的问题和"没有道理？"在顶栏，那几段数轴不在，数轴才能用满画面高
      - {at: s1, act: hide, target: q}
      - {with: prev, act: hide, target: myth}
      - {after: prev, act: show, target: line}
      - {at: s1@a, act: arrow, target: line, args: {to: 3}}
      - {at: s2@s, act: stretch, target: line, args: {to: 6}, dur: 1.0}
      - {with: prev, act: show, target: s1}

  - id: Turn
    say:
      - {id: s1, pace: normal, text: "{@back}那乘负一呢？乘负一，{@t}就是让箭头绕着零转半圈。", en: "And times negative one? Times negative one turns the arrow half a turn around zero."}
      - {id: s2, pace: normal, text: "三乘负一，箭头转到了左边，{@r}指向负三。", en: "Three times negative one: the arrow has turned to the left and points to negative three."}
      - {id: s3, pace: normal, text: "负三再乘负一，{@t}再转半圈，又转回右边的正三。", en: "Negative three times negative one: another half turn, back to positive three on the right."}
    do:
      - {at: s1@back, act: hide, target: s1}
      - {with: prev, act: stretch, target: line, args: {to: 3}}
      - {at: s1@t, act: turn, target: line, args: {label: '\times(-1)'}, dur: 1.4}
      - {at: s2@r, act: show, target: t1}
      - {at: s3@t, act: turn, target: line, args: {label: '\times(-1)'}, dur: 1.4}
      - {after: prev, act: show, target: t2}

  - id: Predict
    pause: {type: predict, prompt: 零乘负三是零，每行加三，下一行是几？, hold: 3, app_item: ep15-why-2}
    say:
      - {id: s1, pace: normal, text: "{@tab}换一张表看：二乘负三是负六，{@b}一乘负三是负三。", en: "Now look at a table: two times negative three is negative six, one times is negative three."}
      - {id: s2, pace: ask, text: "{@z}零乘负三是零，结果每次加三，{@q}下一行是几？", en: "Zero times negative three is zero. Each row goes up by three. What's the next row?"}
    do:
      - {at: s1@tab, act: hide, target: t1}
      - {with: prev, act: hide, target: t2}
      - {with: prev, act: erase, target: line}
      - {after: prev, act: hide, target: line}
      - {after: prev, act: show, target: r1}
      - {at: s1@b, act: show, target: r2}
      - {at: s2@z, act: show, target: r3}
      - {at: s2@q, act: show, target: r4q}

  - id: Answer
    say:
      - {id: s1, pace: normal, text: "{@a}接着加三就是正三，和刚才箭头转回来的结果一样。", en: "Up by three again gives positive three, the same as the arrow that turned back."}
    do:
      - {at: s1@a, act: hide, target: r4q}
      - {with: prev, act: show, target: r4}
      - {after: prev, act: mark, target: "r4#q"}

  - id: Main
    say:
      - {id: s1, pace: normal, text: "{@now}现在算负二乘负三。先拆开：{@sp}负二是负一乘二，负三是负一乘三。", en: "Now negative two times negative three. Split them: negative two is negative one times two, negative three is negative one times three."}
      - {id: s2, pace: normal, text: "{@a}二乘三，{@s}先把箭头拉长到六。", en: "Two times three: stretch the arrow to six first."}
      - {id: s3, pace: normal, text: "乘一个负一，{@t}转半圈，到了负六。", en: "Times one negative one: half a turn, to negative six."}
      - {id: s4, pace: normal, text: "再乘一个负一，{@t}又转半圈，{@r}回到正六。", en: "Times the other negative one: another half turn, back to positive six."}
      - {id: s5, pace: slow, text: "拉长一次，转身两次，正好转回原来的方向。", en: "One stretch and two turns bring it right back to where it started pointing."}
    do:
      - {at: s1@now, act: unmark, target: "r4#q"}
      - {with: prev, act: hide, target: r1}
      - {with: prev, act: hide, target: r2}
      - {with: prev, act: hide, target: r3}
      - {with: prev, act: hide, target: r4}
      - {after: prev, act: show, target: line}
      - {at: s1@sp, act: show, target: eq1}
      - {at: s2@a, act: arrow, target: line, args: {to: 3, role: B}}
      - {at: s2@s, act: stretch, target: line, args: {to: 6}, dur: 1.0}
      - {at: s3@t, act: turn, target: line, args: {label: '\times(-1)'}, dur: 1.4}
      - {at: s4@t, act: turn, target: line, args: {label: '\times(-1)'}, dur: 1.4}
      - {at: s4@r, act: transform, from: eq1, to: eq2}
      - {with: prev, act: hide, target: eq1}
      - {at: s5, act: step}

  - id: NonExample
    shows: non_example
    say:
      - {id: s1, pace: normal, text: "{@d}加法可不一样。{@p}负二加负三，{@g}是从负二再往左走三格。", en: "Adding is different. Negative two plus negative three starts at negative two and goes three more to the left."}
      - {id: s2, pace: normal, text: "{@f}到了负五，两个负号没有抵消，加法里没有负负得正。", en: "It lands on negative five. The two minus signs don't cancel. Adding has no such rule."}
    do:
      - {at: s1@d, act: erase, target: line}
      - {with: prev, act: hide, target: eq2}
      - {at: s1@p, act: mark_point, target: line, args: {at: -2, label: '-2', role: A}}
      - {with: prev, act: show, target: add}
      - {at: s1@g, act: highlight, target: line, args: {from: -5, to: -2, role: "NO"}, dur: fit}
      - {at: s2@f, act: mark_point, target: line, args: {at: -5, label: '-5', role: "NO"}}

  - id: Landing
    shows: landing
    say:
      - {id: s1, pace: slow, text: "{@law}所以乘负一就是转半圈，{@two}两个负数相乘，{@a}转两次就回到正的。", en: "So times negative one is half a turn. Multiply two negatives, turn twice, and you're back to positive."}
    do:
      - {at: s1@law, act: erase, target: line}
      - {with: prev, act: hide, target: add}
      - {after: prev, act: show, target: eq2}
      - {with: prev, act: arrow, target: line, args: {to: 6, role: B}}
      - {at: s1@two, act: turn, target: line, args: {label: '\times(-1)'}, dur: 1.2}
      - {at: s1@a, act: turn, target: line, args: {label: '\times(-1)'}, dur: 1.2}
      - {with: prev, act: mark, target: "eq2#res"}

  - id: Close
    say:
      - {id: s1, pace: normal, text: "负负得正是一个约定，可只有这样约定，{@x}别的规则才不会坏。", en: "It is a convention, but it's the only one that keeps the other rules from breaking."}
      - {id: s2, pace: ask, text: "{@q}转半圈是乘负一，那转四分之一圈，是乘什么？", en: "Half a turn is times negative one. What would a quarter turn be?"}
    do:
      - {at: s1, act: hide, target: line}
      - {after: prev, act: show, target: q}
      - {with: prev, act: show, target: myth}
      - {at: s1@x, act: cross, target: "myth#m"}
