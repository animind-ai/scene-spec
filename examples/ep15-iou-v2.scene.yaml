# v2 版式副本：与 ep15-iou.scene.yaml 相同，只加 style.layout: v2（无右侧栏、顶栏 1.0、满宽 stage；字幕仍是双语两行烧录带）。
# 洞察系列 #15 负负得正（七年级），第 3 版（撕欠条），接替 ep15.scene.yaml。按脚本 insight/ep15-negative-times-negative/script.yaml（第 3 轮，撕欠条）写。
# 一个洞察：乘法是"几个几"，前面的数管放进 / 拿走，后面的数管现金 / 欠条（组件 wallet：钱包 + 余额条，#16 也用）。
# 情境开场：小林欠同桌两张三元欠条，同桌撕了，变穷还是变富、停三秒、小林说"没道理，背下来"；钱包再放两张现金，余额 0；
# 2×3 放进现金 +6、2×(−3) 放进欠条 −6、(−2)×3 拿走现金 −6，每次做完复原；预测暂停后 (−2)×(−3)：撕掉两张欠条，余额 +6；
# 非例：空钱包里先欠 2 再欠 3，(−2)+(−3) = −5；结尾：是约定，只有这样约定账才算得平。
spec: "0.1"

meta:
  id: ep15
  title: 负负得正
  line: insight
  units: [J1]
  episode: 15
  grade: 七年级
  author: Boxi Yu
  license: CC-BY-4.0

pedagogy:
  insight: 乘法还是几个几：前面的数管放进还是拿走，后面的数管现金还是欠条；负二乘负三就是拿走两张三元的欠条，欠的钱没了，余额反而涨了六元
  misconception: 负负得正没有道理，背下来就行；两个负号会抵消，所以负二加负三是正五
  non_example: 加法里没有负负得正：负二加负三是又欠两元、再欠三元，一共欠五元，余额是负五
  status: proof
  landing: Landing

style:
  side: column  # v2 改版：侧栏内容放回主讲区右边一栏，顶栏只留一行问题句
  layout: v2  # 视觉规范 v2（style-v2 批量重渲，2026-10-20）
  theme: paper
  canvas: "16:9"
  voice:
    persona: teacher-hs
    speed: 1.0
  segmented: true
  step_hold: 1.0

objects:
  q:
    type: text
    text: '$(-2)\times(-3)=\ ?$'
    level: title
    in: top
  q2:
    type: text
    text: '[$(-2)\times(-3)=$]{#l} [$+6$]{#r .HL}'
    level: title
    in: top
  myth:
    in: side
    type: text
    text: '[没有道理？]{#m}'
    role: "NO"
    level: title
  wallet:
    widget: wallet
    in: stage
    value: 3
    iou: 2
    slots: 4
    range: 6
  wal2:
    widget: wallet
    in: stage
    value: 3
    slots: 4
    range: 6
  r1:
    type: text
    text: '[$2\times 3=6$]{#all}'
    in: side
  r2:
    type: text
    text: '$2\times(-3)=-6$'
    below: r1
    gap: sm
  r3:
    type: text
    text: '$(-2)\times 3=-6$'
    below: r2
    gap: sm
  r4q:
    type: text
    text: '[$(-2)\times(-3)=$]{#l} [$?$]{#q .NO}'
    below: r3
    gap: sm
  r4:
    type: text
    text: '[$(-2)\times(-3)=6$]{#all .HL}'
    below: r3
    gap: sm
  # 加法非例和结论也在右侧栏（版式：算式放 side，不放 footer），接在四行下面
  add:
    type: text
    text: '[$(-2)+(-3)$]{#l} [$=-5$]{#r .NO}'
    below: r4
    gap: lg
  law:
    type: text
    text: '[$(-2)\times(-3)$]{#l} [$=+6$]{#r .HL}'
    below: r4
    gap: lg

i18n:
  en:
    meta: {title: "Why Is a Negative Times a Negative Positive?"}
    objects:
      myth: {text: '[No reason?]{#m}'}
    beats:
      Hook: {pause: {prompt: "The deskmate tears up the IOUs. Is Lin poorer or richer?"}}
      Predict: {pause: {prompt: "Take away two IOUs: what happens to the balance?"}}

beats:
  - id: Hook
    pause: {type: predict, prompt: 同桌把欠条撕了，小林变穷了还是变富了？, hold: 3, app_item: ep15-before-1}
    say:
      - {id: s1, pace: normal, text: "{@w}小林欠同桌两张欠条，每张三元。", en: "{@w}Lin owes a deskmate two IOUs, three yuan each."}
      - {id: s2, pace: ask, text: "{@q}同桌把欠条撕了，小林变穷了还是变富了？", en: "{@q}The deskmate tears the IOUs up. Is Lin poorer now, or richer?"}
      - {id: s3, pace: normal, text: "先别急，在心里算一算。", en: "Don't rush. Work it out in your head first."}
    do:
      - {at: s1@w, act: show, target: wallet}
      - {at: s2@q, act: show, target: q}

  - id: Myth
    shows: misconception
    say:
      - {id: s1, pace: normal, text: "小林挠挠头：{@m}负负得正，没什么道理，背下来就行吧。", en: "Lin isn't sure: {@m}negative times negative is positive, there's no reason, just memorise it."}
    do:
      - {at: s1@m, act: show, target: myth}

  - id: Setup
    say:
      - {id: s1, pace: normal, text: "我们一起看。{@w}给钱包再放两张三元现金，现金和欠条都是三元一张。", en: "Let's look together. {@w}Put two three-yuan notes of cash in the wallet too; cash and IOUs are three yuan each."}
      - {id: s2, pace: normal, text: "现在两张现金、两张欠条，一张抵一张，{@b}余额是零。", en: "Two notes of cash, two IOUs, they cancel out: {@b}the balance is zero."}
      - {id: s3, pace: normal, text: "乘法还是几个几：前面的数管放进还是拿走，后面的数管现金还是欠条。", en: "Multiplication is still 'so many lots of': the first number says put in or take away, the second says cash or IOU."}
    do:
      - {at: s1@w, act: put, target: wallet, args: {kind: cash, count: 2}, dur: fit}
      - {at: s2@b, act: mark, target: "wallet.balance"}
      - {at: s3, act: unmark, target: "wallet.balance"}

  - id: Cases
    say:
      - {id: s1, pace: normal, text: "二乘三，{@p}放进两份三元现金，{@r}余额多了六元。", en: "Two times three: {@p}put in two lots of three yuan cash. {@r}The balance goes up by six."}
      - {id: s2, pace: normal, text: "二乘负三，{@p}放进两张欠条，{@r}余额少了六元。", en: "Two times negative three: {@p}put in two IOUs. {@r}The balance goes down by six."}
      - {id: s3, pace: normal, text: "负二乘三，{@p}拿走两份现金，{@r}余额也少了六元。", en: "Negative two times three: {@p}take away two lots of cash. {@r}The balance also goes down by six."}
    do:
      - {at: s1@p, act: put, target: wallet, args: {kind: cash, count: 2}, dur: fit}
      - {at: s1@r, act: show, target: r1}
      - {at: s2, act: take, target: wallet, args: {kind: cash, count: 2, quiet: true}}
      - {at: s2@p, act: put, target: wallet, args: {kind: iou, count: 2}, dur: fit}
      - {at: s2@r, act: show, target: r2}
      - {at: s3, act: take, target: wallet, args: {kind: iou, count: 2, quiet: true}}
      - {at: s3@p, act: take, target: wallet, args: {kind: cash, count: 2}, dur: fit}
      - {at: s3@r, act: show, target: r3}

  - id: Predict
    pause: {type: predict, prompt: 拿走两张欠条，余额会怎样？, hold: 3, app_item: ep15-why-2}
    say:
      - {id: s1, pace: ask, text: "那负二乘负三，{@q}拿走两张欠条，余额会怎样？", en: "So negative two times negative three: {@q}take away two IOUs. What happens to the balance?"}
    do:
      - {at: s1, act: put, target: wallet, args: {kind: cash, count: 2}}
      - {at: s1@q, act: show, target: r4q}

  - id: Tear
    say:
      - {id: s1, pace: normal, text: "{@t}把这两张欠条撕掉，欠别人的六元钱就没有了。", en: "{@t}Tear up the two IOUs, and the money you owed is gone."}
      - {id: s2, pace: slow, text: "{@r}余额反而涨了六元，所以负二乘负三是正六。", en: "{@r}The balance actually goes up by six, so negative two times negative three is positive six."}
      - {id: s3, pace: normal, text: "拿走欠条和放进现金一样，{@m}都让你更有钱。", en: "Taking away IOUs is just like putting in cash: {@m}either way you're richer."}
      - {id: s4, pace: normal, text: "欠条变少，就是你欠的钱变少，{@b}等于多了钱。", en: "Fewer IOUs means you owe less, which is {@b}the same as having more."}
    do:
      - {at: s1@t, act: take, target: wallet, args: {kind: iou, count: 2}, dur: fit}
      - {at: s2@r, act: hide, target: r4q}
      - {with: prev, act: show, target: r4}
      - {with: prev, act: transform, from: q, to: q2}
      - {with: prev, act: hide, target: q}
      - {at: s3, act: step}
      - {at: s3@m, act: mark, target: "r1#all"}
      - {with: prev, act: mark, target: "r4#all"}
      - {at: s4, act: unmark, target: "r1#all"}
      - {with: prev, act: unmark, target: "r4#all"}
      - {at: s4@b, act: mark, target: "wallet.balance"}

  - id: NonExample
    shows: non_example
    say:
      - {id: s1, pace: normal, text: "加法可不一样。负二加负三，{@a}是先欠两元，{@b}再欠三元。", en: "Adding is different. Negative two plus negative three means {@a}owing two, then {@b}owing three more."}
      - {id: s2, pace: normal, text: "{@f}一共欠了五元，余额是负五，两个负号并没有抵消。", en: "{@f}Five owed in all, a balance of negative five. The two minus signs don't cancel."}
    do:
      - {at: s1, act: unmark, target: "wallet.balance"}
      - {with: prev, act: hide, target: wallet}
      - {after: prev, act: show, target: wal2}
      - {with: prev, act: show, target: add}
      - {at: s1@a, act: put, target: wal2, args: {kind: iou, value: 2}}
      - {at: s1@b, act: put, target: wal2, args: {kind: iou, value: 3}}
      - {at: s2@f, act: mark, target: "wal2.balance"}

  - id: Landing
    shows: landing
    say:
      - {id: s1, pace: slow, text: "{@law}所以负负得正，就是拿走欠条，余额往上涨。", en: "{@law}So negative times negative is positive: take away IOUs and the balance goes up."}
      - {id: s2, pace: normal, text: "四行放在一起看，{@m}放进现金和拿走欠条，余额都往上涨。", en: "Put the four lines together: {@m}putting in cash and taking away IOUs both raise the balance."}
    do:
      - {at: s1, act: unmark, target: "wal2.balance"}
      - {with: prev, act: hide, target: wal2}
      - {with: prev, act: hide, target: add}
      - {after: prev, act: show, target: wallet}
      - {at: s1@law, act: show, target: law}
      - {at: s2@m, act: mark, target: "r1#all"}
      - {with: prev, act: mark, target: "r4#all"}

  - id: Close
    say:
      - {id: s1, pace: normal, text: "负负得正是一个约定，可只有这样约定，{@x}这笔账才算得平。", en: "It is a convention, but it's the only one that makes {@x}the accounts balance."}
      - {id: s2, pace: ask, text: "{@q}那减去一个负数，为什么反而是加上它？", en: "{@q}Next: why does subtracting a negative number add?"}
    do:
      - {at: s1, act: unmark, target: "r1#all"}
      - {with: prev, act: unmark, target: "r4#all"}
      - {at: s1@x, act: cross, target: "myth#m"}
