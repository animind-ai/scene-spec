# v2 版式副本：与 ep39.scene.yaml 相同，只加 style.layout: v2（无右侧栏、顶栏 1.0、满宽 stage；字幕仍是双语两行烧录带）。
# 洞察系列 #39 差分：离散的导数（高二）。sums 系列第四集（收尾），接 #31，回访 #29。第 2 版：汽车路标（2026-10-18 用户定）。
# 按脚本 insight/ep39-finite-differences/script.yaml（第 2 版）写。
# 开场就是 #31 的片尾画面（dx = 0.1 的正方形、底部 (x²)′ = 2x、右侧「边长只能取整数呢？」）；钩子问差的差为什么总是 2、停三秒、
# 说出"数列和函数是两回事"；把边长换成时间：车第 n 秒停在 n²，路边插路标 0、1、4、9、16、25，每秒一道弧；
# 差分表：每秒走 1 3 5 7 9（像速度）、每秒多走 2 2 2 2（像加速度）——路标越来越稀、却稀得均匀；对上 2x 和 2，多出的 1 是 #31 的角块；
# 非例 2ⁿ 短短一句；落到二阶差分是常数；片尾回访 #29：1 + 3 + 5 + 7 + 9 按 L 形一圈一圈拼成 5 × 5。
spec: "0.1"

meta:
  id: ep39
  title: 差分：离散的导数
  line: insight
  units: [S6, S7]
  episode: 39
  grade: 高二
  author: Boxi Yu
  license: CC-BY-4.0

pedagogy:
  insight: 一辆车第 n 秒停在 n 平方的位置，路标是 0、1、4、9、16、25；每秒走的路是相邻路标的距离 1、3、5、7、9，像速度；这些距离每秒多 2，像加速度；路标越来越稀、却稀得很均匀，这个均匀就是二阶差分是常数，正对应导数 2x 和 2
  misconception: 数列和函数是两回事；差的差是常数这种题只能背题型
  non_example: 二的 n 次方 1、2、4、8、16，每秒走的路还是 1、2、4、8，越拉越开，怎么差都不会变成常数
  status: proof
  landing: Landing

style:
  side: column  # v2 改版：侧栏内容放回主讲区右边一栏，顶栏只留一行问题句
  layout: v2  # 视觉规范 v2（style-v2 批量重渲，2026-10-20）
  theme: paper
  canvas: "16:9"
  voice:
    persona: teacher-hs
    speed: 1.0
  segmented: true
  step_hold: 1.0

data:
  sq: [0, 1, 4, 9, 16, 25]
  d1: [1, 3, 5, 7, 9]
  d2: [2, 2, 2, 2]
  p2: [1, 2, 4, 8, 16]
  q1: [1, 2, 4, 8]

objects:
  # 开场：#31 的片尾（同样的定义）
  nq:
    type: text
    text: '边长只能取整数呢？'
    role: HL
    level: title
    in: side
  law:
    type: text
    text: "[$(x^2)'=2x$]{#l}"
    role: HL
    level: display
    in: footer
  chk:
    type: text
    text: '$x=1\ \to\ 2$'
    right_of: law
    gap: lg
  sq01:
    widget: dissect
    role: A
    in: stage
    view: [[-1.2, -1.2], [6.8, 5.6]]
    shapes:
      S: {rect: [4, 4], label: '$x^2$'}
      R: {rect: [0.1, 4], at: [4, 0], role: B}
      T: {rect: [4, 0.1], at: [0, 4], role: B}
      C: {rect: [0.1, 0.1], at: [4, 4], role: C}
    guides:
      d: {from: [4, -0.5], to: [4.1, -0.5], label: '$dx=0.1$', role: HL, side: below, solid: true}
  # 本集
  # 本集
  hq1:
    type: text
    text: '$0,\ 1,\ 4,\ 9,\ 16,\ \dots$'
    level: title
    in: side
  hq2:
    type: text
    text: '[差的差 $=2$]{#l} [？]{#q .NO}'
    level: title
    below: hq1
    gap: sm
  myth:
    type: text
    text: '[数列和函数是两回事？]{#m}'
    role: "NO"
    below: hq2
    gap: md
  cm1:
    type: text
    text: '[速度]{#k} [$2n$]{#a}[$+1$]{#c .C} [$\to\ 2x$]{#r .HL}'
    below: myth
    gap: lg
  cm2:
    type: text
    text: '[加速度]{#k} [$2\to 2$]{#r .HL}'
    below: cm1
    gap: sm
  law39:
    type: text
    text: '[$(n+1)^2-n^2=$]{#l} [$2n+1$]{#r .HL}'
    level: display
    in: footer
  road:
    in: side
    widget: number_line
    range: [0, 25]
    measures: ["1", "3", "5", "7", "9"]
    role: A
  tab:
    widget: diff_table
    in: stage
    rows:
      - {data: sq, role: A, label: '$n^2$', name: 位置}
      - {data: d1, role: B, label: '$\Delta$', name: 每秒走}
      - {data: d2, role: C, label: '$\Delta^2$', name: 每秒多走}
    known: [6, 0, 0]
  pow:
    widget: diff_table
    in: stage
    rows:
      - {data: p2, role: A, label: '$2^n$', name: 二的幂}
      - {data: q1, role: "NO", label: '$\Delta$', name: 每秒走}
    known: [5, 0]
  sq5:
    widget: dissect
    role: A
    in: stage
    view: [[-1.0, -0.8], [5.0, 4.8]]
    shapes:
      L0: {dots: {points: [[0, 0]]}, hidden: true, role: A}
      L1: {dots: {points: [[1, 0], [1, 1], [0, 1]]}, hidden: true, role: B}
      L2: {dots: {points: [[2, 0], [2, 1], [2, 2], [0, 2], [1, 2]]}, hidden: true, role: C}
      L3: {dots: {points: [[3, 0], [3, 1], [3, 2], [3, 3], [0, 3], [1, 3], [2, 3]]}, hidden: true, role: A}
      L4: {dots: {points: [[4, 0], [4, 1], [4, 2], [4, 3], [4, 4], [0, 4], [1, 4], [2, 4], [3, 4]]}, hidden: true, role: B}


i18n:
  en:
    meta: {title: "Finite Differences: The Discrete Derivative"}
    objects:
      nq: {text: "Whole numbers only?"}
      hq2: {text: "[Gaps of gaps $=2$]{#l} [?]{#q .NO}"}
      myth: {text: "[Unrelated topics?]{#m}"}
      cm1: {text: '[Speed]{#k} [$2n$]{#a}[$+1$]{#c .C} [$\to\ 2x$]{#r .HL}'}
      cm2: {text: '[Acceleration]{#k} [$2\to 2$]{#r .HL}'}
      tab:
        rows:
          - {data: sq, role: A, label: '$n^2$', name: Position}
          - {data: d1, role: B, label: '$\Delta$', name: Per second}
          - {data: d2, role: C, label: '$\Delta^2$', name: Extra}
      pow:
        rows:
          - {data: p2, role: A, label: '$2^n$', name: Powers of 2}
          - {data: q1, role: "NO", label: '$\Delta$', name: Per second}
    beats:
      Hook: {pause: {prompt: "Gaps of gaps all equal two. Coincidence?"}}
      Predict: {pause: {prompt: "How much more does the car go each second than the last?"}}

beats:
  - id: Hook
    pause: {type: predict, prompt: 差的差全是二，是巧合吗？, hold: 3, app_item: ep39-before-1}
    say:
      - {id: s1, pace: normal, text: "练习册上有道找规律题，{@q}开头是零、一、四、九、十六。", en: "A workbook has a find-the-pattern puzzle that {@q}starts zero, one, four, nine, sixteen."}
      - {id: s2, pace: ask, text: "相邻的差再求一次差，全是二。这是巧合吗？", en: "Take the gaps, then the gaps between those: all twos. Is that a coincidence?"}
    do:
      # 开场：一下子摆出 #31 的片尾画面
      - {at: s1, act: show, target: sq01, dur: 0.01}
      - {with: prev, act: show, target: "sq01#d", dur: 0.01}
      - {with: prev, act: show, target: law, dur: 0.01}
      - {with: prev, act: show, target: chk, dur: 0.01}
      - {after: prev, act: show, target: nq, dur: 0.01}
      - {at: s1@q, act: hide, target: nq}
      - {after: prev, act: show, target: hq1}
      - {with: prev, act: show, target: hq2}

  - id: Myth
    shows: misconception
    say:
      - {id: s1, pace: normal, text: "前桌摆摆手：{@m}这是数列题，跟函数不沾边，背题型就行。", en: "The kid in front waves it off: {@m}it's a sequence problem, nothing to do with functions, just memorise the type."}
    do:
      - {at: s1@m, act: show, target: myth}

  - id: Setup
    say:
      - {id: s1, pace: normal, text: "上一集边长多长了一小段 d x；{@t}现在把边长换成时间。", en: "Last time the side grew by a little dx. {@t}Now let's swap the side for time."}
      - {id: s2, pace: normal, text: "一辆车第 n 秒停在 n 平方的位置，{@p}停在哪，就在哪插一根路标。", en: "A car stops at n squared after n seconds, and {@p}we plant a signpost wherever it stops."}
    do:
      - {at: s1@t, act: hide, target: sq01}
      - {with: prev, act: hide, target: law}
      - {with: prev, act: hide, target: chk}
      - {after: prev, act: show, target: road.tick}
      - {with: prev, act: show, target: road.unit}
      - {with: prev, act: hide, target: road.label, dur: 0.01}
      - {at: s2@p, act: mark_point, target: road, args: {at: 0, role: HL}}
      - {with: prev, act: show, target: "road.label[0]"}

  - id: Road
    say:
      - {id: s1, pace: normal, text: "第一秒{@j1}停在一，第二秒{@j2}到四，然后{@j3}九、{@j4}十六、{@j5}二十五。", en: "After one second {@j1}it's at one, after two {@j2}at four, then {@j3}nine, {@j4}sixteen, {@j5}twenty-five."}
      - {id: s2, pace: normal, text: "路标越来越稀，可是稀得很均匀。", en: "The signposts spread further apart, but they spread out evenly."}
    do:
      - {at: s1@j1, act: jump, target: road, args: {length: "1", count: 1, from: 0, keep: true, numbers: false}, dur: 0.45}
      - {after: prev, act: mark_point, target: road, args: {at: 1, role: HL}, dur: 0.15}
      - {with: prev, act: show, target: "road.label[1]", dur: 0.15}
      - {at: s1@j2, act: jump, target: road, args: {length: "3", count: 1, from: 1, keep: true, numbers: false}, dur: 0.45}
      - {after: prev, act: mark_point, target: road, args: {at: 4, role: HL}, dur: 0.15}
      - {with: prev, act: show, target: "road.label[4]", dur: 0.15}
      - {at: s1@j3, act: jump, target: road, args: {length: "5", count: 1, from: 4, keep: true, numbers: false}, dur: 0.45}
      - {after: prev, act: mark_point, target: road, args: {at: 9, role: HL}, dur: 0.15}
      - {with: prev, act: show, target: "road.label[9]", dur: 0.15}
      - {at: s1@j4, act: jump, target: road, args: {length: "7", count: 1, from: 9, keep: true, numbers: false}, dur: 0.45}
      - {after: prev, act: mark_point, target: road, args: {at: 16, role: HL}, dur: 0.15}
      - {with: prev, act: show, target: "road.label[16]", dur: 0.15}
      - {at: s1@j5, act: jump, target: road, args: {length: "9", count: 1, from: 16, keep: true, numbers: false}, dur: 0.45}
      - {after: prev, act: mark_point, target: road, args: {at: 25, role: HL}, dur: 0.15}
      - {with: prev, act: show, target: "road.label[25]", dur: 0.15}

  - id: Predict
    pause: {type: predict, prompt: 每秒走的路，一秒比一秒多多少？, hold: 3, app_item: ep39-why-1}
    say:
      - {id: s1, pace: ask, text: "{@q}每秒走的路，一秒比一秒多多少？", en: "{@q}How much further does the car go each second than the second before?"}
    do:
      - {at: s1@q, act: show, target: tab}

  - id: Table
    say:
      - {id: s1, pace: normal, text: "每秒走的路，就是相邻路标的距离：{@d}一、三、五、七、九。", en: "The distance each second is the gap between neighbouring posts: {@d}one, three, five, seven, nine."}
      - {id: s2, pace: normal, text: "这些距离一秒比一秒多二：{@e}二、二、二、二。", en: "Each of those is two more than the one before: {@e}two, two, two, two."}
      - {id: s3, pace: slow, text: "路标稀得均匀，{@m}就是这个多出来的二一直不变。", en: "The posts spread out evenly because {@m}that extra two never changes."}
    do:
      - {at: s1@d, act: derive, target: tab, args: {row: d1, index: "0:5"}, dur: fit}
      - {at: s2@e, act: derive, target: tab, args: {row: d2, index: "0:4"}, dur: fit}

  - id: Compare
    say:
      - {id: s1, pace: normal, text: "{@a}每秒走的路像速度，它就是差分二 n 加一，{@r}对上导数二 x。", en: "{@a}Distance per second is like a speed: the difference two n plus one, {@r}matching the derivative two x."}
      - {id: s2, pace: normal, text: "{@b}每秒多走的像加速度，是二阶差分二，对上二 x 的导数二。", en: "{@b}Extra distance per second is like an acceleration: the second difference two, matching the derivative of two x, which is two."}
      - {id: s3, pace: normal, text: "{@c}多出来的那个一，就是上一集丢不掉的角块。", en: "{@c}The extra one is the corner we couldn't drop last time."}
    do:
      - {at: s1@a, act: show, target: cm1}
      - {at: s2@b, act: show, target: cm2}
      - {at: s3@c, act: show, target: law39}
      - {after: prev, act: mark, target: "cm1#c"}

  - id: NonExample
    shows: non_example
    say:
      - {id: s1, pace: normal, text: "{@p}换成二的 n 次方：一、二、四、八、十六。", en: "{@p}Now try powers of two: one, two, four, eight, sixteen."}
      - {id: s2, pace: normal, text: "{@d}每秒走的还是一、二、四、八，越拉越开，永远不均匀。", en: "{@d}The gaps are one, two, four, eight again: they spread faster and faster, never evenly."}
    do:
      - {at: s1, act: unmark, target: "cm1#c"}
      - {at: s1@p, act: hide, target: tab}
      - {after: prev, act: show, target: pow}
      - {at: s2@d, act: derive, target: pow, args: {row: q1, index: "0:4"}, dur: fit}

  - id: Landing
    shows: landing
    say:
      - {id: s1, pace: slow, text: "{@back}所以平方数的二阶差分是常数，正像 x 平方的二阶导数是常数。", en: "{@back}So the second difference of the squares is constant, just as the second derivative of x squared is constant."}
      - {id: s2, pace: normal, text: "数列的差分和函数的导数，{@x}是同一件事的两个版本。", en: "Differences of a sequence and derivatives of a function are {@x}two versions of the same idea."}
    do:
      - {at: s1@back, act: hide, target: pow}
      - {after: prev, act: show, target: tab}
      - {at: s2@x, act: cross, target: "myth#m"}

  - id: Close
    say:
      - {id: s1, pace: normal, text: "{@st}还记得等差数列的台阶吗？{@l0}一加{@l1}三加{@l2}五加{@l3}七加{@l4}九，正好拼成五乘五。", en: "{@st}Remember the staircases of arithmetic series? {@l0}One plus {@l1}three plus {@l2}five plus {@l3}seven plus {@l4}nine makes exactly five by five."}
      - {id: s2, pace: normal, text: "一圈一圈加上去的，{@d}正是差分算出来的那些数。", en: "The rings we add are {@d}exactly the numbers the differences gave us."}
      - {id: s3, pace: ask, text: "那立方数，要差几次才变成常数？", en: "Next: how many rounds of differences does it take for the cubes to become constant?"}
    do:
      - {at: s1@st, act: hide, target: tab}
      - {with: prev, act: show, target: sq5}
      - {at: s1@l0, act: show, target: "sq5#L0", dur: 0.3}
      - {at: s1@l1, act: show, target: "sq5#L1", dur: 0.3}
      - {at: s1@l2, act: show, target: "sq5#L2", dur: 0.3}
      - {at: s1@l3, act: show, target: "sq5#L3", dur: 0.3}
      - {at: s1@l4, act: show, target: "sq5#L4", dur: 0.3}
      - {at: s2@d, act: mark, target: "law39#r"}
