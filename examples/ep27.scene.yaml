# 洞察系列 #27 指数增长与对数：同一张图的两种读法（高一）。按脚本 insight/ep27-exp-log/script.yaml（第 1 轮）写。
# 开场接 #26 片尾（每走一格翻一倍）；钩子问 log₂ 8 在问什么、停三秒、说出 log(2 + 4) = log 2 + log 4；
# y = 2ˣ 顺着读是指数、倒着读是对数；预测暂停：2 × 4 = 8 在横轴上是 1 + 2 = 3；沿 y = x 对调得到 y = log₂x；
# 非例：2 + 4 = 6 在曲线上只走到 2.58 格；落到"对数问的是乘几次"。画面只用 graph 组件。
spec: "0.1"

meta:
  id: ep27
  title: 指数增长与对数：同一张图的两种读法
  line: insight
  units: [S4]
  episode: 27
  grade: 高一
  author: Boxi Yu
  license: CC-BY-4.0

pedagogy:
  insight: y = 2ˣ 顺着读是指数，倒着读就是对数；log₂ 8 问的是 2 要乘几次才到 8；横轴走一格纵轴翻一倍，所以纵轴上乘起来，横轴上就加起来
  misconception: log₂(2 + 4) = log₂2 + log₂4
  non_example: 2 + 4 = 6，在曲线上找 6，横轴只走到 2.58 格，不是 3 格；3 格对应的是 8 = 2 × 4
  status: proof
  landing: Landing

style:
  theme: paper
  canvas: "16:9"
  voice:
    persona: teacher-hs
    speed: 1.0
  segmented: true
  step_hold: 1.0

objects:
  g:
    widget: graph
    x: [-1.5, 9.5]
    y: [-1.5, 9.5]
    plots:
      - {f: "2^x", label: "y=2^x"}
      - {f: "ln(x)/ln(2)", role: B, label: "y=\\log_2 x"}
    points:
      - {x: 0, role: HL}
      - {x: 1, role: HL}
      - {x: 2, role: HL, label: "(2,4)", label_dir: r}
      - {x: 3, role: HL, label: "(3,8)", label_dir: r}
      - {x: 8, plot: 1, role: B, label: "(8,3)", label_dir: d}
      - {x: 2.585, role: "NO", label: "(2.58,6)", label_dir: r}
    lines:
      - {x: 3, role: HL}
      - {through: [0, 8], slope: 0, role: HL}
      - {through: [0, 0], slope: 1, role: DIM}
      - {through: [0, 6], slope: 0, role: "NO"}
      - {x: 2.585, role: "NO"}
    in: stage
  q:
    type: math
    tex: '\log_2 8=\ ?'
    role: A
    level: title
    in: side
  wrong:
    type: text
    text: '[$\log(2+4)=\log 2+\log 4$？]{#m}'
    role: "NO"
    below: q
    gap: lg
  ask:
    type: text
    text: 横轴上 1、2、3 呢？
    role: HL
    below: q
    gap: lg
  mul:
    type: math
    tex: '2\times 4=8\ \ \leftrightarrow\ \ 1+2=3'
    role: A
    below: q
    gap: lg
  prod:
    type: math
    tex: '\log_2(2\times 4)=\log_2 2+\log_2 4'
    role: B
    below: mul
    gap: md
  wrong2:
    type: text
    text: '[$\log(2+4)=\log 2+\log 4$？]{#m}'
    role: "NO"
    below: prod
    gap: lg
  law:
    type: math
    tex: '\log_2 8=3\ \iff\ 2^3=8'
    role: HL
    in: footer
  nq:
    type: text
    text: 转圈的点，高度画成什么？
    role: HL
    level: title
    in: side

beats:
  - id: Hook
    pause: {type: predict, prompt: log₂ 8 到底在问什么？先想一想。, hold: 3, app_item: ep27-before-1}
    say:
      - {id: s1, pace: ask, text: "{@q}以二为底八的对数，到底在问一个什么问题？", en: "Log base two of eight: what question is it actually asking?"}
      - {id: s2, pace: normal, text: "先想一想，三秒。", en: "Think about it for three seconds."}
    do:
      - {at: s1, act: show, target: g.axes}
      - {at: s1@q, act: show, target: q}

  - id: Myth
    shows: misconception
    say:
      - {id: s1, pace: normal, text: "很多人还会顺手写，{@w}二加四的对数，等于二的对数加四的对数。", en: "And lots of people will happily write that the log of two plus four is the log of two plus the log of four."}
    do:
      - {at: s1@w, act: show, target: wrong}

  - id: Setup
    say:
      - {id: s1, pace: normal, text: "先看 {@c}y 等于二的 x 次方，{@d}x 每往右走一格，y 就翻一倍。", en: "Start with y equals two to the x. Each step right, y doubles."}
      - {id: s2, pace: normal, text: "顺着读，{@f}x 等于三，y 就是八，这是指数。", en: "Read it forwards: x is three, so y is eight. That's a power."}
      - {id: s3, pace: normal, text: "倒过来读，{@b}已知 y 等于八，问 x 是几，这就是对数。", en: "Read it backwards: given y is eight, what is x? That's a log."}
      - {id: s4, pace: normal, text: "所以以二为底八的对数是三，{@law}它问的是二要乘几次才到八。", en: "So log base two of eight is three. It asks how many times you multiply by two to get eight."}
    do:
      - {at: s1, act: hide, target: wrong}
      - {at: s1@c, act: draw, target: g, args: {plot: 0}}
      - {with: prev, act: show, target: "g.plot_label[0]"}
      - {at: s1@d, act: show, target: "g.point[0]"}
      - {after: prev, act: show, target: "g.point[1]", dur: 0.5}
      - {after: prev, act: show, target: "g.point[2]", dur: 0.5}
      - {after: prev, act: show, target: "g.point[3]", dur: 0.5}
      - {at: s2@f, act: show, target: "g.line[0]"}
      - {at: s3@b, act: hide, target: "g.line[0]"}
      - {with: prev, act: show, target: "g.line[1]"}
      - {after: prev, act: show, target: "g.line[0]"}
      - {at: s4@law, act: show, target: law}
      - {with: prev, act: hide, target: "g.line[0]"}
      - {with: prev, act: hide, target: "g.line[1]"}

  - id: Predict
    pause: {type: predict, prompt: 2 × 4 = 8，在横轴上 1、2、3 是什么关系？, hold: 3, app_item: ep27-why-2}
    say:
      - {id: s1, pace: ask, text: "{@m}二乘四等于八，在横轴上，这三个数又是什么关系？", en: "Two times four is eight. On the x-axis, how are these three numbers related?"}
    do:
      - {at: s1@m, act: show, target: ask}

  - id: Multiply
    say:
      - {id: s1, pace: normal, text: "{@a}二在一格，四在两格，八在三格，{@sum}而一加二正好等于三。", en: "Two is at one step, four at two steps, eight at three. One plus two is exactly three."}
      - {id: s2, pace: normal, text: "纵轴上乘起来，横轴上就加起来，{@p}对数把乘法变成了加法。", en: "Multiplying up the y-axis means adding along the x-axis. Logs turn multiplication into addition."}
      - {id: s3, pace: normal, text: "把横竖对调，{@yx}沿着 y 等于 x 翻过去，{@log}就是对数函数的图像。", en: "Swap across and up, flipping over the line y equals x, and you get the graph of the log function."}
    do:
      - {at: s1, act: hide, target: ask}
      - {at: s1@sum, act: show, target: mul}
      - {at: s2@p, act: show, target: prod}
      - {at: s3@yx, act: show, target: "g.line[2]"}
      - {at: s3@log, act: draw, target: g, args: {plot: 1}}
      - {with: prev, act: show, target: "g.plot_label[1]"}
      - {after: prev, act: show, target: "g.point[4]"}

  - id: NonExample
    shows: non_example
    say:
      - {id: s1, pace: ask, text: "{@w}那二加四的对数，是不是一加二，也等于三？", en: "So is the log of two plus four also one plus two, which is three?"}
      - {id: s2, pace: normal, text: "二加四是六，{@six}在曲线上找六，{@x}横轴只走了两格半多一点。", en: "Two plus four is six. Find six on the curve: x has only gone a bit past two and a half."}
      - {id: s3, pace: normal, text: "三格对应的是八，不是六，{@no}所以和的对数不等于对数的和。", en: "Three steps give eight, not six. So the log of a sum is not the sum of the logs."}
    do:
      - {at: s1@w, act: show, target: wrong2}
      - {at: s2@six, act: show, target: "g.line[3]"}
      - {after: prev, act: show, target: "g.point[5]"}
      - {at: s2@x, act: show, target: "g.line[4]"}
      - {at: s3@no, act: cross, target: "wrong2#m"}

  - id: Landing
    shows: landing
    say:
      - {id: s1, pace: slow, text: "所以对数问的是，{@m}底数要乘几次才能得到这个数。", en: "So a log asks: how many times must the base be multiplied to reach this number?"}
      - {id: s2, pace: normal, text: "指数和对数是同一张图，一个顺着读，一个倒着读。", en: "Powers and logs are the same graph, one read forwards, one read backwards."}
      - {id: s3, pace: normal, text: "{@p}乘积的对数等于对数的和，因为多乘一次，就是多走一格。", en: "The log of a product is the sum of the logs, because one more multiplication is one more step."}
    do:
      - {at: s1, act: hide, target: "g.line[3]"}
      - {with: prev, act: hide, target: "g.line[4]"}
      - {with: prev, act: hide, target: "g.point[5]"}
      - {at: s1@m, act: mark, target: law}
      - {at: s3@p, act: unmark, target: law}
      - {with: prev, act: mark, target: prod}

  - id: Close
    say:
      - {id: s1, pace: normal, text: "下次再看到对数，先问一句，它在问的是乘几次。", en: "Next time you see a log, first ask: how many multiplications is it asking about?"}
      - {id: s2, pace: ask, text: "{@q}要是一个点绕着圆匀速转圈，它的高度画出来，会是什么形状？", en: "Next: if a point goes round a circle at a steady speed, what shape does its height trace out?"}
    do:
      - {at: s1, act: unmark, target: prod}
      - {at: s2@q, act: hide, target: q}
      - {with: prev, act: hide, target: mul}
      - {with: prev, act: hide, target: prod}
      - {with: prev, act: hide, target: wrong2}
      - {after: prev, act: show, target: nq}
