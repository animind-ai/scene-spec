# v2 版式副本：与 ep01.scene.yaml 相同，只加 style.layout: v2（无右侧栏、顶栏 1.0、满宽 stage；字幕仍是双语两行烧录带）。
# 洞察系列 #1 凑十：为什么 8+5 先拆 5？（数的世界入门系列第一集，一年级）。
# 钩子问八加五、停三秒，说出两个迷思（一个个往上数；拆开会少）；先真的往上数五下，预测暂停后五个里跳两个进框，
# 满框就是一个十，2 + 3 = 5 当面回答"拆开会少"；非例 3 + 4 框装不满；落到 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13，
# 等号读作两边一样多；数轴上 8 → 10 → 13 跳一次。结尾只留一个装满的十格框（#2 的开头画面）。
# 脚本：insight/ep01-make-ten/script.yaml（第 1 轮）。
spec: "0.1"

meta:
  id: ep01
  title: 凑十：为什么 8+5 先拆 5？
  line: insight
  units: [P2]
  episode: 1
  grade: 一年级
  author: Boxi Yu
  license: CC-BY-4.0

pedagogy:
  insight: 把五拆成两个和三个，先填满一个十，十三就一眼看得出来，一个也没少
  misconception: 八加五只能从八开始一个一个往上数；把五拆开就会少掉几个
  non_example: 三加四加起来不到十，十格框装不满，凑十帮不上忙
  status: proof
  landing: Equation

style:
  side: column  # v2 改版：侧栏内容放回主讲区右边一栏，顶栏只留一行问题句
  layout: v2  # 视觉规范 v2（style-v2 批量重渲，2026-10-20）
  theme: paper
  canvas: "16:9"
  voice:
    persona: friend-ps
    speed: 1.0
  segmented: true
  step_hold: 1.0

objects:
  q:
    type: text
    text: '$8+5=\ ?$'
    level: title
    in: top
  myth:
    in: side
    type: text
    text: 拆开会少掉几个？
    role: "NO"
  ans:
    type: text
    text: '[$8+5=13$]{#a .HL}'
    level: title
    in: top
  frame:
    widget: ten_frame
    side: 5
    in: stage
  ten:
    type: text
    text: '满框 = 一个 [$10$]{#t .HL}'
    level: title
    in: footer
  split:
    type: text
    text: '[$2+3=5$]{#s .B}：一个也没少'
    level: title
    in: footer
  frame2:
    widget: ten_frame
    in: stage
  nonex:
    type: text
    text: '$3+4=7$：不到十，凑十帮不上'
    level: title
    in: footer
  eq:
    type: text
    text: '[$8+5$]{#lhs} [$=8+2+3$]{#mid} [$=10+3$]{#ten} [$=13$]{#ans .HL}'
    level: title
    in: top
  line:
    widget: number_line
    range: [0, 15]
    parts: 1
    measures: ["2", "3"]
    role: B
    in: stage

i18n:
  en:
    meta: {title: "Make Ten: Why Split the 5 in 8+5?"}
    objects:
      myth: {text: "Do we lose some\nif we split?"}  # v2：侧栏里分两行
      ten: {text: 'Full frame = one [$10$]{#t .HL}'}
      split: {text: '[$2+3=5$]{#s .B}: none lost'}
      nonex: {text: '$3+4=7$: not ten, no help'}
    beats:
      Hook: {pause: {prompt: "Eight eggs in the box and five more come. How many in all?"}}
      Predict: {pause: {prompt: "How many of the five jump over to fill the frame?"}}

beats:
  - id: Hook
    pause: {type: predict, prompt: 蛋盒里八个蛋又来五个，一共几个？, hold: 3, app_item: ep01-before-1}
    say:
      - {id: s1, pace: ask, text: "{@q}蛋盒里放了八个蛋，又拿来五个，一共几个？", en: "{@q}There are eight eggs in the egg box, and here come five more. How many in all?"}
      - {id: s2, pace: normal, text: "先别数，在心里估一估。", en: "Don't count yet. Just make a guess in your head."}
    do:
      - {at: s1, act: show, target: frame}
      - {with: prev, act: fill, target: frame, args: {count: 8}, dur: 1.2}
      - {after: prev, act: side, target: frame, args: {count: 5}, dur: 0.8}
      - {at: s1@q, act: show, target: q}

  - id: Myth
    shows: misconception
    say:
      - {id: s1, pace: normal, text: "弟弟要从八开始，一个一个往上数。", en: "Little brother wants to start at eight and count up one at a time."}
      - {id: s2, pace: normal, text: "{@w}妹妹担心，把五拆开，会少掉几个。", en: "{@w}Little sister worries that breaking the five apart will lose a few."}
    do:
      - {at: s2@w, act: show, target: myth}

  - id: Setup
    say:
      - {id: s1, pace: normal, text: "我们一起看。{@f}这是十格框，两排，每排五格。", en: "Let's look together. {@f}This is a ten frame: two rows, five boxes in each."}
      - {id: s2, pace: normal, text: "框里放了八个圆点，框外面还有五个。", en: "Eight dots are inside the frame, and five more are outside."}
    do:
      - {at: s1@f, act: focus, target: "frame.frame"}
      - {at: s2, act: unfocus, target: frame}

  - id: CountOn
    say:
      - {id: s1, pace: brisk, text: "{@c}从八往上数，九、十、十一、十二、十三。", en: "{@c}Counting up from eight: nine, ten, eleven, twelve, thirteen."}
      - {id: s2, pace: normal, text: "数对了，可是要数五下，数多了容易乱。", en: "That's right, but it takes five counts, and it's easy to slip."}
    do:
      - {at: s1@c, act: count, target: frame, args: {start: 9}, dur: fit}

  - id: Predict
    pause: {type: predict, prompt: 五个里面跳几个过去，框就满了？, hold: 2.5, app_item: ep01-predict-1}
    say:
      - {id: s1, pace: ask, text: "换个办法。{@q}五个里面跳几个过去，框就满了？", en: "Let's try another way. {@q}How many of the five should jump in to fill the frame?"}
    do:
      - {at: s1@q, act: mark, target: "frame.cell[8]"}
      - {with: prev, act: mark, target: "frame.cell[9]"}

  - id: MakeTen
    say:
      - {id: s1, pace: slow, text: "{@j}跳两个过去，十格框正好装满，一格不空。", en: "{@j}Two jump in, and the frame is full. Not one empty box."}
      - {id: s2, pace: normal, text: "{@t}装满的十格框，就是一个十，不用再一个个数。", en: "{@t}A full ten frame is one ten. No need to count each one."}
      - {id: s3, pace: normal, text: "{@s}五拆成了两个和三个，合起来还是五个。", en: "{@s}The five became two and three. Put together, it's still five."}
    do:
      - {at: s1, act: unmark, target: "frame.cell[8]"}
      - {with: prev, act: unmark, target: "frame.cell[9]"}
      - {at: s1@j, act: move_in, target: frame, args: {count: 2}, dur: 1.4}
      - {at: s2, act: step}
      - {at: s2@t, act: show, target: ten}
      - {with: prev, act: focus, target: "frame.frame"}
      - {at: s3@s, act: unfocus, target: frame}
      - {with: prev, act: hide, target: ten}
      - {with: prev, act: show, target: split}
      - {after: prev, act: cross, target: myth}

  - id: Reveal
    shows: non_example
    say:
      - {id: s1, pace: slow, text: "{@a}一个十，再加三个，一眼就能看出是十三。", en: "{@a}One ten and three more. You can see thirteen at a glance."}
      - {id: s2, pace: normal, text: "那三加四呢？{@n}三个加四个，框还没装满。", en: "What about three plus four? {@n}Three and four don't fill the frame."}
      - {id: s3, pace: normal, text: "{@x}不到十，凑十就帮不上忙，直接数就好。", en: "{@x}It's less than ten, so making ten doesn't help. Just count."}
    do:
      - {at: s1, act: hide, target: split}
      - {at: s1@a, act: hide, target: q}
      - {with: prev, act: hide, target: myth}
      - {after: prev, act: show, target: ans}
      - {at: s2, act: step}
      - {at: s2@n, act: hide, target: frame}
      - {after: prev, act: show, target: frame2}
      - {with: prev, act: fill, target: frame2, args: {count: 3, role: A}, dur: 0.8}
      - {after: prev, act: fill, target: frame2, args: {count: 4, role: B}, dur: 0.8}
      - {at: s3@x, act: show, target: nonex}

  - id: Equation
    shows: landing
    say:
      - {id: s1, pace: normal, text: "{@e}写成算式，八加五，和十加三一样多。", en: "{@e}As a number sentence, eight plus five is the same as ten plus three."}
      - {id: s2, pace: normal, text: "{@m}等号的意思不是算出来，是两边一样多。", en: "{@m}The equals sign doesn't mean work it out. It means both sides are the same."}
      - {id: s3, pace: normal, text: "{@l}在数轴上，从八跳两格到十，{@h}再跳三格到十三。", en: "{@l}On the number line, hop two from eight to ten, {@h}then three more to thirteen."}
    do:
      - {at: s1, act: hide, target: frame2}
      - {with: prev, act: hide, target: nonex}
      - {with: prev, act: hide, target: ans}
      - {after: prev, act: show, target: frame}
      - {with: prev, act: show, target: eq}
      - {at: s1@e, act: mark, target: "eq#mid"}
      - {after: prev, act: mark, target: "eq#ten"}
      - {at: s2@m, act: unmark, target: "eq#mid"}
      - {with: prev, act: unmark, target: "eq#ten"}
      - {with: prev, act: mark, target: "eq#lhs"}
      - {after: prev, act: mark, target: "eq#ten"}
      - {at: s3@l, act: unmark, target: "eq#lhs"}
      - {with: prev, act: unmark, target: "eq#ten"}
      - {with: prev, act: hide, target: frame}
      - {with: prev, act: show, target: line}
      - {after: prev, act: mark_point, target: line, args: {at: 8, role: A}}
      - {after: prev, act: jump, target: line, args: {length: "2", count: 1, from: 8, numbers: false}, dur: 0.8}
      - {at: s3@h, act: jump, target: line, args: {length: "3", count: 1, from: 10, keep: true, numbers: false}, dur: 0.8}
      - {after: prev, act: mark_point, target: line, args: {at: 13}}

  - id: LookBack
    say:
      - {id: s1, pace: normal, text: "看完和大人一起，用豆子摆一摆，自己凑个十。", en: "After watching, grab some beans with a grown-up and make your own ten."}
      - {id: s2, pace: ask, text: "{@n}十格框是两排五个。换成五排两个，一样多吗？", en: "{@n}A ten frame is two rows of five. What about five rows of two: is that the same?"}
    do:
      # 收成 #2 的开头画面：只留装满的十格框
      - {at: s2@n, act: hide, target: line}
      - {with: prev, act: hide, target: eq}
      - {after: prev, act: show, target: frame}
      - {with: prev, act: remove, target: frame, args: {which: side}}
