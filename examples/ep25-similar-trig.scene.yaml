# 洞察系列 #25 sin30° 为什么永远是 1/2（九年级）。单集，回访 #10（放大两倍面积四倍）。
# 按脚本 insight/ep25-similar-triangles-trig/script.yaml（第 1 轮）写；早先样片 ep25.scene.yaml 留给截图回归。
# 钩子问三角形画大 sin 会不会变大、停三秒、说出"越大 sin 越大"；对边 ÷ 斜边读数 1/2；
# 预测暂停后放大、缩小、再放大，读数不动；为什么正好 1/2：复制一块沿邻边翻下去，拼成等边三角形，
# 竖边 = 2 × 对边 = 斜边；非例：边长放大两倍，面积四倍；落到 sin 30° = 1/2。
spec: "0.1"

meta:
  id: ep25
  title: sin30° 为什么永远是 1/2
  line: insight
  units: [J12, J13]
  episode: 25
  grade: 九年级
  author: Boxi Yu
  license: CC-BY-4.0

pedagogy:
  insight: 三十度的直角三角形翻过来拼一个，正好是等边三角形，对边是这条边的一半，也就是斜边的一半；放大缩小只是同一个形状，所以 sin 三十度永远是二分之一
  misconception: 三角形画得越大，sin 三十度也越大
  non_example: 边长放大两倍，面积变成四倍；面积会跟着大小变，对边除以斜边这个比值不会
  status: proof
  landing: Landing

style:
  theme: paper
  canvas: "16:9"
  voice:
    persona: teacher-hs
    speed: 1.0
  segmented: true
  step_hold: 1.0

params:
  s: {value: 2, min: 0.5, max: 6}   # 横边（邻边）长

objects:
  g:
    widget: graph
    x: [-0.5, 6.5]
    y: [-0.5, 4.0]
    ticks: 1
    plots:
      - {f: "x/sqrt(3)", label: "30^\\circ", domain: [0, 6.4]}
    points:
      - {x: 0, role: C}
    triangles:
      - {point: 0, run: "s", role: C}
    in: stage
  ratio:
    type: readout
    label: "对边 ÷ 斜边 ="
    value: "(s/sqrt(3))/(2s/sqrt(3))"
    format: fraction
    role: HL
    level: title
    in: side
  area:
    type: readout
    label: "面积 ="
    value: "s*s/sqrt(3)/2"
    digits: 2
    role: "NO"
    below: ratio
    gap: lg
  wrong:
    type: text
    text: '[越大 sin 越大？]{#m}'
    role: "NO"
    below: area
    gap: lg
  tri:
    widget: dissect
    role: A
    in: stage
    view: [[-0.6, -2.6], [5.2, 2.6]]
    shapes:
      T:
        polygon: [[0, 0], [3.464, 0], [3.464, 2]]
        edges:
          - {at: [[3.464, 0], [3.464, 2]], text: '对边'}
          - {at: [[0, 0], [3.464, 2]], text: '斜边'}
    copies: {T2: T}
    pieces:
      T2: {role: B}
    guides:
      side: {from: [3.464, -2], to: [3.464, 2], label: '$2\times$对边', role: HL, side: right}
    merges:
      E: {pieces: [T, T2], role: HL}
  ang:
    type: text
    text: '$30^\circ+30^\circ=60^\circ$'
    level: title
    in: footer
  law:
    type: text
    text: '[$\sin 30^\circ$]{#l} [$=\dfrac{1}{2}$]{#r .HL}'
    level: title
    in: footer

i18n:
  en:
    meta: {title: "Why sin 30° Is Always One Half"}
    objects:
      ratio: {label: "Opp ÷ hyp ="}
      area: {label: "Area ="}
      wrong: {text: '[Bigger = bigger sin?]{#m}'}
      tri:
        shapes:
          T:
            edges:
              - {at: [[3.464, 0], [3.464, 2]], text: 'opposite'}
              - {at: [[0, 0], [3.464, 2]], text: 'hypotenuse'}
        guides:
          side: {label: '$2\times$opposite'}
    beats:
      Hook: {pause: {prompt: "Draw a 30° right triangle bigger. Does sin 30° get bigger?"}}
      Predict: {pause: {prompt: "Enlarge it three times. Does opposite ÷ hypotenuse change?"}}

beats:
  - id: Hook
    pause: {type: predict, prompt: 三十度的直角三角形画大一点，sin30° 会变大吗？, hold: 3, app_item: ep25-before-1}
    say:
      - {id: s1, pace: normal, text: "两个同学各画了一个{@q}三十度的直角三角形，一小一大。", en: "Two classmates each draw {@q}a thirty-degree right triangle, one small and one big."}
      - {id: s2, pace: ask, text: "大的那个，sin 三十度会变大吗？", en: "For the big one, does sine of thirty degrees get bigger?"}
      - {id: s3, pace: normal, text: "你站哪一边？先想想。", en: "Whose side are you on? Think first."}
    do:
      - {at: s1@q, act: show, target: g.axes}
      - {after: prev, act: draw, target: g, args: {plot: 0}}
      - {with: prev, act: show, target: g.plot_label}
      - {after: prev, act: show, target: "g.triangle[0]"}
      - {with: prev, act: show, target: "g.point[0]"}

  - id: Myth
    shows: misconception
    say:
      - {id: s1, pace: normal, text: "画大的那位很得意，{@m}说自己的边更长，sin 肯定也更大。", en: "The one with the big triangle is pleased, {@m}saying their sides are longer, so their sine must be bigger."}
    do:
      - {at: s1@m, act: show, target: wrong}

  - id: Setup
    say:
      - {id: s1, pace: normal, text: "我们一起看。{@r}sin 三十度，是对边除以斜边。", en: "Let's look together. {@r}Sine of thirty degrees is the opposite side divided by the hypotenuse."}
      - {id: s2, pace: normal, text: "对边是三十度角对着的那条，{@h}斜边是最长的那条。", en: "The opposite side faces the thirty-degree angle; {@h}the hypotenuse is the longest side."}
    do:
      - {at: s1@r, act: show, target: ratio}
      - {at: s2@h, act: mark, target: ratio}

  - id: Predict
    pause: {type: predict, prompt: 放大到三倍，对边 ÷ 斜边会变吗？, hold: 3, app_item: ep25-why-1}
    say:
      - {id: s1, pace: ask, text: "{@q}把三角形放大到三倍，对边除以斜边会变吗？", en: "{@q}Enlarge the triangle to three times the size. Does opposite over hypotenuse change?"}
    do:
      - {at: s1, act: unmark, target: ratio}
      - {at: s1@q, act: show, target: area}

  - id: Scale
    say:
      - {id: s1, pace: normal, text: "{@up}放大，对边变长了，斜边也跟着一样变长。", en: "{@up}Enlarge it: the opposite side grows, and the hypotenuse grows by the same factor."}
      - {id: s2, pace: normal, text: "{@dn}缩小再{@up}放大，比值一直停在二分之一，一点不动。", en: "{@dn}Shrink it, {@up}enlarge it again: the ratio stays at one half and doesn't budge."}
      - {id: s3, pace: normal, text: "大小在变，形状没变，这些三角形都是相似的。", en: "The size changes but the shape doesn't: these triangles are all similar."}
    do:
      - {at: s1@up, act: tween, args: {s: 6}, dur: fit, ease: in_out}
      - {at: s2@dn, act: tween, args: {s: 1}, dur: fit, ease: in_out}
      - {at: s2@up, act: tween, args: {s: 4}, dur: fit, ease: in_out}

  - id: Why
    say:
      - {id: s1, pace: normal, text: "为什么正好是二分之一？{@c}把三角形复制一个，{@f}沿着邻边翻过去。", en: "Why exactly one half? {@c}Copy the triangle and {@f}flip it over the adjacent side."}
      - {id: s2, pace: normal, text: "{@a}三十度加三十度是六十度，{@e}三个角都是六十度的就是等边三角形。", en: "{@a}Two thirty-degree angles make sixty. {@e}All three angles are sixty: it's an equilateral triangle."}
      - {id: s3, pace: slow, text: "{@v}竖着的这条边是对边的两倍，{@h}又和斜边一样长。", en: "{@v}This vertical side is twice the opposite side, and {@h}it's as long as the hypotenuse."}
      - {id: s4, pace: normal, text: "所以对边正好是斜边的一半，不管三角形画多大。", en: "So the opposite side is exactly half the hypotenuse, however big the triangle is."}
    do:
      - {at: s1, act: hide, target: g}
      - {after: prev, act: show, target: tri}
      - {at: s1@c, act: copy, target: tri, args: {piece: T2}}
      - {at: s1@f, act: flip, target: tri, args: {piece: T2, axis: [[0, 0], [3.464, 0]]}, dur: fit}
      - {at: s2@a, act: show, target: ang}
      - {at: s2@e, act: merge, target: tri, args: {name: E}, dur: 0.8}
      - {at: s3, act: step}
      - {at: s3@v, act: show, target: "tri#side"}
      - {at: s3@h, act: mark, target: "tri#side"}

  - id: NonExample
    shows: non_example
    say:
      - {id: s1, pace: normal, text: "{@back}可是面积就不一样了，我们再回到坐标系里看一看面积。", en: "{@back}Area is a different story. Let's go back to the coordinate plane and look at it."}
      - {id: s2, pace: normal, text: "{@d}边长放大两倍时{@m}面积变成了四倍，面积跟着大小在变。", en: "{@d}Double the sides and {@m}the area becomes four times as big. Area changes with size."}
    do:
      - {at: s1@back, act: unmark, target: "tri#side"}
      - {with: prev, act: hide, target: tri}
      - {with: prev, act: hide, target: ang}
      - {after: prev, act: show, target: g}
      - {after: prev, act: tween, args: {s: 2}, dur: 1.0}
      - {at: s2@d, act: tween, args: {s: 4}, dur: fit, ease: in_out}
      - {at: s2@m, act: mark, target: area}

  - id: Landing
    shows: landing
    say:
      - {id: s1, pace: slow, text: "{@law}所以 sin 三十度永远是二分之一，和三角形的大小无关。", en: "{@law}So sine of thirty degrees is always one half, whatever the size of the triangle."}
      - {id: s2, pace: normal, text: "{@r}它是一个比值，只看形状，不看大小，放大缩小都一样。", en: "{@r}It's a ratio: it depends on shape, not size, and scaling never changes it."}
    do:
      - {at: s1, act: unmark, target: area}
      - {at: s1@law, act: show, target: law}
      - {at: s2@r, act: mark, target: ratio}

  - id: Close
    say:
      - {id: s1, pace: normal, text: "三角形再大，sin 三十度也不会变大，{@x}它只和角度有关。", en: "However big the triangle, sine of thirty degrees doesn't grow. {@x}It depends only on the angle."}
      - {id: s2, pace: ask, text: "{@q}那换成六十度，对边除以斜边又是多少？", en: "{@q}So what about sixty degrees: what's opposite over hypotenuse then?"}
    do:
      - {at: s1, act: unmark, target: ratio}
      - {at: s1@x, act: cross, target: "wrong#m"}
