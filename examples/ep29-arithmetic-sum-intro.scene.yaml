# 洞察系列 #29 等差数列求和：倒过来再加一遍（高一 / 高二）。sums 系列第一集，接 #30。
# 情境开场版（2026-10-18 试做），按 insight/ep29-arithmetic-sum/script-intro.yaml 写；和 ep29.scene.yaml 只差开场两段（Hook、Myth）：
# 老师让全班从一加到一百，一个孩子很快报出 5050；同桌不服——首尾配对只对从一开始的数管用。片尾画面没动（#30 开头要还原）。
# 一个洞察：和画成台阶点阵，复制一份转半圈拼上就是长方形；钩子问 1 + … + 100 为什么是 5050、停三秒、说出"只对从 1 开始管用"；
# 1..5：复制、预测暂停、转半圈推过来，5 排 × 6；推到 100 × 101 ÷ 2；迷思：3 + 5 + 7 + 9 + 11 照样拼成 5 排 × 14；
# 非例：1 + 2 + 4 + 8 拼上后各排 9、6、6、9，中间有空；落到 S = n(a₁ + aₙ) ÷ 2。片尾画面是 #30 的开头画面。
spec: "0.1"

meta:
  id: ep29-intro
  title: 等差数列求和：倒过来再加一遍
  line: insight
  units: [S6]
  episode: 29
  grade: 高一
  author: Boxi Yu
  license: CC-BY-4.0

pedagogy:
  insight: 把一个和画成一级一级的台阶，再复制一份转半圈拼上，就是一个长方形；每排都是首项加末项，一共项数那么多排，所以和是项数乘首项加末项再除以二
  misconception: 首尾配对这招只对从一开始的数列管用，比如一加到一百
  non_example: 一加二加四加八每级多得不一样，转半圈拼上，有的排九个点、有的排六个点，拼不成长方形
  status: proof
  landing: Landing

style:
  theme: paper
  canvas: "16:9"
  voice:
    persona: teacher-hs
    speed: 1.0
  segmented: true
  step_hold: 1.0

objects:
  q1:
    type: text
    text: '$1+2+3+\cdots+100$'
    level: title
    in: side
  q2:
    type: text
    text: '[$=5050$]{#r} [$?$]{#q .NO}'
    level: title
    below: q1
    gap: sm
  q3:
    type: text
    text: '[$=100\times 101\div 2$]{#m} [$=5050$]{#r .HL}'
    below: q1
    gap: sm
  myth:
    type: text
    text: '[只对从 1 开始管用？]{#m}'
    role: "NO"
    below: q2
    gap: md
  a5:
    type: text
    text: '$1+2+3+4+5$'
    below: myth
    gap: lg
  b5:
    type: text
    text: '[$=5\times 6\div 2$]{#m} [$=15$]{#r .HL}'
    below: a5
    gap: sm
  a35:
    type: text
    text: '$3+5+7+9+11$'
    below: myth
    gap: lg
  b35:
    type: text
    text: '[$=5\times 14\div 2$]{#m} [$=35$]{#r .HL}'
    below: a35
    gap: sm
  ag:
    type: text
    text: '$1+2+4+8$'
    below: myth
    gap: lg
  bg:
    type: text
    text: '每排 9、6、6、9 个'
    role: "NO"
    below: ag
    gap: sm
  nq:
    type: text
    text: '曲线每一点涨得多快？'
    role: HL
    level: title
    in: side
  law:
    type: text
    text: '[$S=$]{#s} [$n(a_1+a_n)$]{#nw .HL} [$\div 2$]{#h}'
    level: display
    in: footer
  st5:
    widget: dissect
    role: A
    in: stage
    view: [[-1.4, -0.8], [12.6, 5.6]]
    shapes:
      D:
        dots: {rows: [1, 2, 3, 4, 5]}
    copies:
      E: D
    pieces:
      E: {role: B}
    guides:
      rows: {from: [-0.7, 0], to: [-0.7, 4], label: '5 排', role: HL, side: left}
      cols: {from: [0, 4.7], to: [5, 4.7], label: '每排 6 个', role: HL, side: above}
      p0: {from: [5.6, -0.3], to: [5.6, 0.3], label: '$1+5$', role: HL, side: right}
      p1: {from: [5.6, 0.7], to: [5.6, 1.3], label: '$2+4$', role: HL, side: right}
  odd:
    widget: dissect
    role: A
    in: stage
    view: [[-1.6, -0.8], [14.4, 10.0]]
    shapes:
      D:
        dots: {rows: [3, 5, 7, 9, 11]}
    copies:
      E: D
    pieces:
      E: {role: B}
    guides:
      rows: {from: [-0.7, 0], to: [-0.7, 4], label: '5 排', role: HL, side: left}
      cols: {from: [0, 4.7], to: [13, 4.7], label: '每排 $3+11=14$ 个', role: HL, side: above}
      n: {from: [-0.7, 0], to: [-0.7, 4], label: '$n$ 排', role: HL, side: left}
      w: {from: [0, 4.7], to: [13, 4.7], label: '每排 $a_1+a_n$ 个', role: HL, side: above}
  geo:
    widget: dissect
    role: A
    in: stage
    view: [[-1.0, -0.8], [9.0, 8.4]]
    shapes:
      D:
        dots: {rows: [1, 2, 4, 8]}
    copies:
      E: D
    pieces:
      E: {role: B}
    guides:
      g1: {from: [1.6, 1], to: [4.4, 1], role: "NO", solid: true}
      g2: {from: [3.6, 2], to: [6.4, 2], role: "NO", solid: true}

beats:
  - id: Hook
    pause: {type: predict, prompt: 他怎么一下子算出五千零五十的？, hold: 3, app_item: ep29-before-1}
    say:
      - {id: s1, pace: normal, text: "{@q}老师让全班从一加到一百，{@r}一个孩子很快就报出五千零五十。", en: "A teacher told the class to add up every number from one to a hundred. One boy called out five thousand and fifty almost at once."}
      - {id: s2, pace: ask, text: "你先琢磨一下：他怎么算得这么快？", en: "Turn it over in your head first: how did he do it so fast?"}
    do:
      - {at: s1@q, act: show, target: q1}
      - {at: s1@r, act: show, target: q2}

  - id: Myth
    shows: misconception
    say:
      - {id: s1, pace: normal, text: "同桌不服气：{@m}首尾配对这招，只对从一开始的数管用。", en: "His deskmate wasn't impressed: pairing first with last only works when you start at one."}
    do:
      - {at: s1@m, act: show, target: myth}

  - id: Setup
    say:
      - {id: s1, pace: normal, text: "我们先看小一点的：{@a}一加到五，{@d}每个数画成一排点。", en: "Let's start smaller: one up to five, each number drawn as a row of dots."}
      - {id: s2, pace: normal, text: "一个、两个、三个，一直到五个，像一级一级的台阶。", en: "One, two, three, up to five: it looks like a staircase."}
    do:
      - {at: s1@a, act: show, target: a5}
      - {at: s1@d, act: show, target: st5}

  - id: Predict
    pause: {type: predict, prompt: 再复制一份台阶，转半圈拼上去，会拼成什么形状？, hold: 3, app_item: ep29-why-1}
    say:
      - {id: s1, pace: ask, text: "{@c}再复制一份台阶，转半圈拼上去，会拼成什么形状？", en: "Copy the staircase, turn the copy half a turn and fit it on. What shape do we get?"}
    do:
      - {at: s1@c, act: copy, target: st5, args: {piece: E, by: [7, 0]}}

  - id: Flip
    say:
      - {id: s1, pace: normal, text: "{@r}把这份复制转半圈，{@s}再推过来，贴住原来的台阶。", en: "Turn the copy half a turn, then slide it over against the first staircase."}
      - {id: s2, pace: normal, text: "严丝合缝，拼成一个长方形：{@rows}五排，{@cols}每排六个点。", en: "A perfect fit: a rectangle, five rows of six dots."}
      - {id: s3, pace: normal, text: "每一排都是首尾配对：{@p0}一加五，{@p1}二加四，都等于六。", en: "Each row is a first-and-last pair: one plus five, two plus four, all six."}
      - {id: s4, pace: normal, text: "两份台阶一共五乘六，三十个点，{@r}一份就是十五。", en: "Two staircases make five times six, thirty dots, so one is fifteen."}
      - {id: s5, pace: normal, text: "换成一百级台阶，就是一百排，每排一百零一个点。", en: "With a hundred steps, there are a hundred rows of a hundred and one dots."}
      - {id: s6, pace: slow, text: "{@h}一份是一百乘一百零一的一半，正好五千零五十。", en: "One staircase is half of a hundred times a hundred and one: exactly five thousand and fifty."}
    do:
      - {at: s1@r, act: rotate, target: st5, args: {piece: E, angle: 180}, dur: fit}
      - {at: s1@s, act: shift, target: st5, args: {piece: E, to: [3.666667, 1.333333]}, dur: fit}
      - {at: s2@rows, act: show, target: "st5#rows"}
      - {at: s2@cols, act: show, target: "st5#cols"}
      - {at: s3@p0, act: show, target: "st5#p0"}
      - {at: s3@p1, act: show, target: "st5#p1"}
      - {at: s4, act: show, target: b5}
      - {at: s4@r, act: mark, target: "b5#r"}
      - {at: s6@h, act: hide, target: q2}
      - {with: prev, act: show, target: q3}
      - {after: prev, act: mark, target: "q3#r"}

  - id: Try
    say:
      - {id: s1, pace: normal, text: "那不从一开始呢？{@a}试试三加五加七加九加十一。", en: "What if we don't start at one? Try three plus five plus seven plus nine plus eleven."}
      - {id: s2, pace: normal, text: "台阶每级多两个点。{@c}照样复制一份，{@r}转半圈拼上。", en: "Each step is two dots longer. Copy it, turn it half a turn and fit it on, same as before."}
      - {id: s3, pace: normal, text: "还是长方形：{@rows}五排，{@cols}每排三加十一，十四个点。", en: "Still a rectangle: five rows, each three plus eleven, fourteen dots."}
      - {id: s4, pace: normal, text: "{@b}所以和是五乘十四除以二，{@x}等于三十五。", en: "So the sum is five times fourteen over two, thirty-five."}
    do:
      - {at: s1, act: unmark, target: "q3#r"}
      - {with: prev, act: hide, target: st5}
      - {with: prev, act: hide, target: a5}
      - {with: prev, act: hide, target: b5}
      - {at: s1@a, act: show, target: a35}
      - {with: prev, act: show, target: odd}
      - {at: s2@c, act: copy, target: odd, args: {piece: E, by: [0, 5.5]}}
      - {at: s2@r, act: rotate, target: odd, args: {piece: E, angle: 180}, dur: 1.0}
      - {after: prev, act: shift, target: odd, args: {piece: E, to: [9.428571, 1.428571]}, dur: fit}
      - {at: s3@rows, act: show, target: "odd#rows"}
      - {at: s3@cols, act: show, target: "odd#cols"}
      - {at: s4@b, act: show, target: b35}
      - {at: s4@x, act: mark, target: "b35#r"}
      - {with: prev, act: cross, target: "myth#m"}

  - id: NonExample
    shows: non_example
    say:
      - {id: s1, pace: normal, text: "要是每级多得不一样呢？{@a}比如一加二加四加八。", en: "And if the steps grow by different amounts? Say one plus two plus four plus eight."}
      - {id: s2, pace: normal, text: "{@c}转半圈拼上，{@b}有的排九个，有的排六个，{@g}拼不成长方形。", en: "Flip and fit: some rows have nine, some have six. No rectangle."}
    do:
      - {at: s1, act: unmark, target: "b35#r"}
      - {with: prev, act: hide, target: odd}
      - {with: prev, act: hide, target: a35}
      - {with: prev, act: hide, target: b35}
      - {at: s1@a, act: show, target: ag}
      - {with: prev, act: show, target: geo}
      - {at: s2@c, act: copy, target: geo, args: {piece: E, by: [0, 4.5]}}
      - {after: prev, act: rotate, target: geo, args: {piece: E, angle: 180}, dur: 0.8}
      - {after: prev, act: shift, target: geo, args: {piece: E, to: [5.666667, 0.733333]}, dur: 1.0}
      - {at: s2@b, act: show, target: bg}
      - {at: s2@g, act: show, target: "geo#g1"}
      - {with: prev, act: show, target: "geo#g2"}

  - id: Landing
    shows: landing
    say:
      - {id: s1, pace: slow, text: "{@back}所以等差数列的和，{@law}是项数乘首项加末项，再除以二。", en: "So an arithmetic series adds up to the number of terms times first plus last, divided by two."}
      - {id: s2, pace: normal, text: "首项是几都行，{@w}要紧的是每一级多出来的一样多。", en: "The first term can be anything. What matters is that every step grows by the same amount."}
    do:
      - {at: s1@back, act: hide, target: geo}
      - {with: prev, act: hide, target: ag}
      - {with: prev, act: hide, target: bg}
      - {after: prev, act: show, target: odd}
      - {with: prev, act: show, target: a35}
      - {with: prev, act: show, target: b35}
      - {with: prev, act: hide, target: "odd#rows"}
      - {with: prev, act: hide, target: "odd#cols"}
      - {with: prev, act: show, target: "odd#n"}
      - {with: prev, act: show, target: "odd#w"}
      - {at: s1@law, act: show, target: law}
      - {at: s2@w, act: underline, target: law}

  - id: Close
    say:
      - {id: s1, pace: normal, text: "这种一级一级的台阶，讲差分的时候还会再见到。", en: "We'll meet this staircase again when we get to finite differences."}
      - {id: s2, pace: ask, text: "{@q}一条曲线在每一点涨得有多快，又该怎么看出来？", en: "Next: how can we see how fast a curve is rising at each point?"}
    do:
      # 片尾画面：长方形、底部公式和右侧一句下一集的问题，不留叠加层（划线、叉），#30 开场好还原
      - {at: s1, act: clear, target: law}
      - {with: prev, act: hide, target: q1}
      - {with: prev, act: hide, target: q3}
      - {with: prev, act: hide, target: myth}
      - {with: prev, act: hide, target: a35}
      - {with: prev, act: hide, target: b35}
      - {at: s2@q, act: show, target: nq}
