[project]
name = "scene-spec"
version = "0.2.0"
description = "数学讲解视频的场景描述格式：JSON Schema 与检查器"
readme = "README.md"
license = "MIT"
authors = [{ name = "Boxi Yu" }]
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.21",
]

[project.scripts]
scene-spec = "scene_spec.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scene_spec"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "scene_spec/schema"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = [".moxian-cache", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "B905"]
